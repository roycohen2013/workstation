---
name: apply

# Runs the live half of the playbook for real. Everything else in CI is static
# analysis: lint.yml proves the YAML parses and the syntax is valid, which is
# exactly what a task that references a directory the OS never created also
# passes. That class of bug -- "Destination directory /etc/ssh/sshd_config.d
# does not exist" -- reached a laptop rather than a runner, because nothing in
# CI had ever executed `make apply`.
#
# On a runner rather than in a container deliberately: a container has no
# systemd, and the playbook enables units, configures zram, rebuilds the
# initramfs and writes GRUB config. In a container those fail for reasons that
# say nothing about whether the config is right, which is the fastest way to
# make a job that everyone learns to ignore.
#
# The runner is disposable, so the playbook is allowed to do its worst to it.

on:
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream drift -- a vendor moving a repo, a package
    # disappearing, a new Ubuntu default -- rather than only on our own edits.
    - cron: "0 6 * * 1"
  pull_request:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/apply.yml"

permissions:
  contents: read

# A push that supersedes another mid-run makes the older result meaningless,
# and this job is slow enough to overlap with itself.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    # Pinned to the release this repo targets, NOT ubuntu-latest. The first real
    # run of this job died on `No package matching 'fastfetch' is available`:
    # ubuntu-latest is still 24.04, group_vars declares packages that exist in
    # 26.04, and the job failed for a reason that said nothing about whether the
    # configuration is correct -- exactly the failure mode ADR-0002 warns about.
    # Keep this in step with var.ubuntu_release in packer/variables.pkr.hcl.
    # The 26.04 image is in public preview, so queue times can be longer.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff a pull request against its base below.
          fetch-depth: 0

      # This job is a REQUIRED check on main, so it must report on every pull
      # request -- including ones touching no Ansible at all. A required check
      # that never reports blocks its PR forever, and a job skipped by `if:` is
      # not a dependable substitute. So the job always runs and short-circuits
      # inside itself: every step below is conditional, and a PR that changes
      # only scripts/ or docs/ passes in seconds without converging anything.
      - name: Decide whether a converge is needed
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "converging: not a pull request"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --name-only "$base"...HEAD \
               | grep -qE '^(ansible/|\.github/workflows/apply\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "converging: this pull request touches ansible/"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to converge: this pull request touches no ansible/ files"
          fi

      - name: Install Ansible
        if: steps.scope.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ansible make
          ansible --version

      - name: Install collections
        if: steps.scope.outputs.needed == 'true'
        run: make deps

      # No --ask-become-pass: the runner has passwordless sudo. That also means
      # this job does NOT exercise the become-prompt path where sudo-rs breaks
      # -- see TROUBLESHOOTING.md. `make doctor` covers that instead.
      - name: Converge (first run)
        if: steps.scope.outputs.needed == 'true'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          ansible-playbook ansible/site.yml \
            -i localhost, -c local \
            -e workstation_phase=live \
            -e workstation_image_version=ci-${{ github.sha }} \
            -e dev_mise_install_runtimes=false \
            --become

      # The real point of running it twice. A playbook that succeeds once but
      # reports changes forever is broken in a way a single run cannot show:
      # it means a task rewrites state it already set, so `make apply` can
      # never be trusted to be a no-op on an up-to-date machine.
      - name: Converge (second run, for idempotence)
        id: second
        if: steps.scope.outputs.needed == 'true'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
          # ansible.cfg sets force_color, which wraps the play recap in ANSI
          # escapes -- the parsing below would then match nothing and report
          # "no play recap found" on every single run. Disabled here, and the
          # escapes are stripped anyway in case this is ever overridden.
          ANSIBLE_NOCOLOR: "1"
        run: |
          # Actions' default shell is `bash -e`, without pipefail: piping into
          # tee would otherwise swallow a non-zero exit from ansible-playbook
          # and let a failed second run report success.
          set -o pipefail
          ansible-playbook ansible/site.yml \
            -i localhost, -c local \
            -e workstation_phase=live \
            -e workstation_image_version=ci-${{ github.sha }} \
            -e dev_mise_install_runtimes=false \
            --become | tee second-run.log

      - name: Report idempotence
        if: always() && steps.scope.outputs.needed == 'true'
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' second-run.log > clean.log
          recap=$(grep -E '^localhost .*ok=' clean.log || true)
          if [ -z "$recap" ]; then
            echo "no play recap found -- the second run did not complete"
            exit 1
          fi
          echo "$recap"
          changed=$(echo "$recap" | sed -n 's/.*changed=\([0-9]*\).*/\1/p')
          failed=$(echo "$recap" | sed -n 's/.*failed=\([0-9]*\).*/\1/p')
          echo "second run: changed=$changed failed=$failed"

          # A failure on the second pass is unambiguous, so it fails the job.
          [ "${failed:-1}" = "0" ] || { echo "::error::second run had failures"; exit 1; }

          # Changes on the second pass are reported but do not fail it. A few
          # tasks re-run legitimately -- the manifest role rewrites its
          # inventory every time by design -- and a job that goes red for an
          # expected reason gets muted, taking the real signal with it. Left as
          # a warning so a jump in the number is visible without being fatal.
          if [ "${changed:-0}" -gt 0 ]; then
            echo "::warning::second run reported changed=$changed -- tasks that are not idempotent"
            grep -E '^changed: ' clean.log || true
          fi

      - name: Upload the second run log
        if: always() && steps.scope.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apply-second-run-log
          path: second-run.log
          if-no-files-found: ignore

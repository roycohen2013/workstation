---
name: lint

# Runs on every push. Deliberately does NOT build an image: a full build takes
# 30-60 minutes and pushes several GB to object storage, which is not a
# reasonable thing to do on every commit. See build.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: pip install --quiet ansible ansible-lint yamllint

      - name: yamllint
        run: yamllint -c .yamllint ansible/ tests/ iso/ packer/http/

      - name: ansible-lint
        run: ansible-lint ansible/

      - name: Playbook syntax check (both phases)
        run: |
          for phase in image live; do
            echo "--- phase=$phase"
            ANSIBLE_CONFIG=ansible.cfg ansible-playbook ansible/site.yml \
              -i localhost, -c local -e "workstation_phase=$phase" --syntax-check
          done

  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read tool version pins
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Format check
        run: packer fmt -check -diff packer/

      - name: Validate
        run: |
          packer init packer/
          packer validate packer/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read tool version pins
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      # Validated per-directory: the two configs use different providers and
      # have no shared state or module relationship.
      - name: Validate
        run: |
          for dir in terraform/*/; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # terraform-docs formats its tables slightly differently between
      # releases, and lint-docs fails the moment regenerated output stops
      # matching what is committed -- so CI and the image must run the SAME
      # version. Both the version and the checksum are read out of
      # group_vars rather than repeated here: a second copy of the pin would
      # eventually disagree with the first, and the failure would look like
      # stale docs rather than a version skew.
      - name: Read tool version pins
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      - name: Install doc tooling
        run: |
          pip install --quiet docsible
          ver=$(sed -n 's/^dev_terraform_docs_version: *"\(.*\)"/\1/p' ansible/group_vars/all.yml)
          sha=$(sed -n 's/^dev_terraform_docs_sha256: *//p' ansible/group_vars/all.yml)
          test -n "$ver" -a -n "$sha" || { echo "could not read the terraform-docs pin from group_vars"; exit 1; }
          echo "terraform-docs v$ver"
          curl -fsSL -o tfd.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${ver}/terraform-docs-v${ver}-linux-amd64.tar.gz"
          echo "${sha}  tfd.tar.gz" | sha256sum -c -
          tar xzf tfd.tar.gz terraform-docs
          sudo install -m 0755 terraform-docs /usr/local/bin/terraform-docs
          rm -f tfd.tar.gz terraform-docs

      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      # Regenerates every committed doc and fails if anything moved. This is
      # what stops docs/ being decorative -- without it nothing would ever
      # notice the reference drifting away from the code it describes.
      - name: Documentation is up to date
        run: make lint-docs

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck $(find scripts tests .claude -name '*.sh' 2>/dev/null | sort)

---
name: build image

# Not run on push. A full image build takes 30-60 minutes and produces
# multi-gigabyte artifacts, so it is triggered deliberately: on a release tag,
# by hand, or on a weekly schedule to pick up upstream security updates.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the result to the artifact bucket"
        type: boolean
        default: false
      channel:
        description: "Channel to publish to"
        type: string
        default: stable
  push:
    tags: ["v*"]
  schedule:
    # Mondays 04:00 UTC -- a fresh image each week with the latest updates.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A full desktop install plus package downloads; well under the 6h ceiling
    # but comfortably past the default.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM is available
        run: |
          # GitHub's Linux runners expose /dev/kvm, but not to the runner user
          # by default -- without this the build silently falls back to
          # software emulation and takes hours instead of minutes.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present; this runner cannot build images"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          kvm-ok || true

      - name: Read tool version pins
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso zstd
          pip install --quiet ansible

      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Compute version
        id: version
        run: echo "version=$(make version)" >> "$GITHUB_OUTPUT"

      # Packer's own downloader has no resume: it gets one attempt at ~2.9GB
      # and gives up at a 30-minute deadline, which is how the 7 and 14
      # September builds died. curl retries and resumes from where it stopped
      # (releases.ubuntu.com advertises Accept-Ranges and serves 206), so a
      # stalled transfer costs a retry rather than the whole build.
      - name: Fetch the installer ISO
        id: iso
        run: |
          iso_dir="$RUNNER_TEMP/iso"
          mkdir -p "$iso_dir"
          name="ubuntu-${UBUNTU_RELEASE}-live-server-amd64.iso"
          base="https://releases.ubuntu.com/${UBUNTU_RELEASE}"
          iso="$iso_dir/$name"

          start=$(date +%s)
          curl --fail --location --show-error --silent \
               --retry 5 --retry-all-errors --retry-delay 5 \
               --continue-at - -o "$iso" "$base/$name"
          elapsed=$(( $(date +%s) - start ))
          bytes=$(stat -c %s "$iso")
          echo "downloaded $bytes bytes in ${elapsed}s" \
               "($(( bytes / (elapsed > 0 ? elapsed : 1) / 1024 / 1024 )) MB/s)"

          # Verify against the same SHA256SUMS Packer would have used, so a
          # resumed or truncated transfer cannot be handed to the build.
          curl --fail --location --silent --retry 5 --retry-all-errors \
               -o "$iso_dir/SHA256SUMS" "$base/SHA256SUMS"
          ( cd "$iso_dir" && grep " \*\?$name\$" SHA256SUMS | sha256sum -c - )

          echo "path=$iso" >> "$GITHUB_OUTPUT"
        env:
          UBUNTU_RELEASE: "26.04"

      - name: Build image
        run: |
          make image VERSION=${{ steps.version.outputs.version }} \
            ARGS='-var iso_url=file://${{ steps.iso.outputs.path }}'

      - name: Summarise artifacts
        run: |
          # Say which directory is missing rather than letting `ls` fail with a
          # bare exit 2. When `make image` wrongly reported success, that opaque
          # code was the only thing that turned the job red, and it buried the
          # real error (an ISO download that timed out) under a shell error from
          # a cosmetic step.
          dir="build/workstation-${{ steps.version.outputs.version }}"
          if [ ! -d "$dir" ]; then
            echo "::error::$dir does not exist -- the build produced no artifacts"
            exit 1
          fi
          {
            echo "### Image \`${{ steps.version.outputs.version }}\`"
            echo
            echo '```'
            ls -lh "$dir/"
            echo '```'
            echo
            cat "$dir/SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"

      # Checksums and the manifest are small and worth keeping on the run even
      # when the images themselves go to the bucket.
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ steps.version.outputs.version }}
          path: |
            build/workstation-*/SHA256SUMS
            build/workstation-*/manifest.json
            build/workstation-*/workstation-manifest.json
            build/workstation-*/docs.html
          retention-days: 90

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          WORKSTATION_BUCKET: ${{ secrets.WORKSTATION_BUCKET }}
          WORKSTATION_CHANNEL: ${{ inputs.channel || 'stable' }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: make publish VERSION=${{ steps.version.outputs.version }}

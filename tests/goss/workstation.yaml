---
# Assertions run inside the image at the end of the Packer build, after the
# seal role. A failure here fails the build, so a broken image is never
# exported, checksummed or published.
#
# Two categories:
#   1. The image contains what it should.
#   2. The image does NOT contain what it must not -- build credentials,
#      machine identity, anything that makes a shared artifact unsafe or
#      makes every machine built from it identical.

# Everything group_vars declares -- apt packages, flatpaks, snaps, and what
# must be absent -- is asserted by declared.goss.tmpl, generated from the set
# roles/manifest recorded in /etc/workstation-declared.json. It is not listed
# here: a second copy of that list is one nobody keeps in step.
gossfile:
  declared.goss.tmpl: {}

package:
  # Only what no group_vars list declares, so the declared set cannot vouch
  # for it.
  #
  # Arrives with ubuntu-desktop-minimal rather than by name; it is what puts a
  # login screen on a flashed machine.
  gdm3:              { installed: true }
  # Pulled in as recommends by claude-desktop; Cowork is unusable without them.
  qemu-system-x86:   { installed: true }
  ovmf:              { installed: true }
  # From the installer, not group_vars. Needed by firstboot to resize the root
  # partition on the target disk, and by the bootloader on bare metal.
  cloud-guest-utils: { installed: true }
  gdisk:             { installed: true }
  grub-efi-amd64:    { installed: true }

file:
  # --- The image is adaptable ------------------------------------------------
  /usr/local/sbin/workstation-firstboot:
    exists: true
    mode: "0755"
  /var/lib/workstation/firstboot-pending:
    exists: true   # firstboot is armed; without this the image never adapts
  /etc/workstation-release:
    exists: true
    contains:
      - /^WORKSTATION_VERSION=/
      - /^WORKSTATION_BUILD_DATE=/

  # --- Bare-metal boot -------------------------------------------------------
  # The one line that decides whether a flashed image finds its root disk on
  # unfamiliar hardware.
  /etc/initramfs-tools/initramfs.conf:
    exists: true
    contains:
      - "MODULES=most"

  # --- Interactive shell ------------------------------------------------------
  # The banner has to be in the IMAGE, not applied later: a flashed machine is
  # logged into long before anything runs `make apply`.
  /etc/profile.d/zz-workstation-fastfetch.sh:
    exists: true
    contains:
      - "fastfetch"
  /etc/skel/.bashrc:
    exists: true
    contains:
      # skel is what users created after imaging inherit, so the alias block
      # landing here is what makes it reach them at all.
      - "alias sysinfo="

  # --- Desktop configuration -------------------------------------------------
  /etc/dconf/db/local.d/00-workstation:
    exists: true
  /etc/dconf/profile/user:
    exists: true
    contains: ["system-db:local"]

  # --- Machine identity is blank --------------------------------------------
  # Non-empty here means every machine from this image shares an identity.
  /etc/machine-id:
    exists: true
    size: 0
  /var/lib/dbus/machine-id:
    exists: true
    size: 0

  # --- cloud-init is out of the way -----------------------------------------
  /etc/cloud/cloud-init.disabled:
    exists: true

  # --- Build residue is gone -------------------------------------------------
  /etc/workstation-build-image:
    exists: false
  # Nothing personal may be baked into a redistributable artifact.
  /root/.ssh/id_rsa:      { exists: false }
  /root/.ssh/id_ed25519:  { exists: false }

command:
  # SSH host keys must be absent so each machine generates its own; shared host
  # keys across machines defeat host verification entirely.
  no-ssh-host-keys:
    exec: "ls /etc/ssh/ssh_host_* 2>/dev/null | wc -l"
    exit-status: 0
    stdout: ["0"]

  # apt lists removed by the seal role.
  apt-lists-cleared:
    exec: "find /var/lib/apt/lists -type f -name '*Packages*' 2>/dev/null | wc -l"
    exit-status: 0
    stdout: ["0"]

  # The system boots to a desktop, not a text console.
  graphical-default-target:
    exec: "systemctl get-default"
    exit-status: 0
    stdout: ["graphical.target"]

  # Power management stays off in the artifact; firstboot turns it on only if
  # it finds real hardware.
  tlp-disabled-in-image:
    exec: "systemctl is-enabled tlp || true"
    exit-status: 0
    stdout: ["disabled"]

  # A shipped image should not be listening for inbound SSH.
  ssh-disabled-in-image:
    exec: "systemctl is-enabled ssh || true"
    exit-status: 0
    stdout: ["disabled"]

  # Wireshark is only useful if the workstation user can capture without sudo,
  # and that hinges on a debconf answer that defaults to "no" on an unattended
  # install. Assert the outcome, not the setting: postinst grants capture via
  # setcap where the filesystem supports it and falls back to setuid otherwise,
  # so either is a pass.
  dumpcap-capture-enabled:
    exec: |
      getcap /usr/bin/dumpcap 2>/dev/null | grep -q cap_net_raw && echo enabled && exit 0
      [ -u /usr/bin/dumpcap ] && echo enabled && exit 0
      echo disabled
    exit-status: 0
    stdout: ["enabled"]

  # The vendor's package registers its own sources.list.d entry pointing at a
  # keyring path it documents. If that file is missing, every apt update on the
  # finished machine fails with NO_PUBKEY -- so assert the key is where the
  # vendor expects it, not merely where our role would default to putting it.
  claude-desktop-keyring-at-vendor-path:
    exec: "test -s /usr/share/keyrings/claude-desktop-archive-keyring.asc && echo present"
    exit-status: 0
    stdout: ["present"]

  # Exactly one apt declaration of the Chrome origin: the vendor's deb822 file.
  # Chrome's postinst writes it and deletes our bootstrap .list itself; the
  # role then stops re-adding ours. A .list back on disk means the two are
  # fighting again and every `make apply` reports a change.
  chrome-single-apt-source:
    exec: |
      test -s /etc/apt/sources.list.d/google-chrome.sources \
        && test ! -e /etc/apt/sources.list.d/google-chrome.list \
        && echo single
    exit-status: 0
    stdout: ["single"]

  # 1Password's keyring must be at the vendor's documented path, not ours.
  1password-keyring-at-vendor-path:
    exec: "test -s /usr/share/keyrings/1password-archive-keyring.gpg && echo present"
    exit-status: 0
    stdout: ["present"]

  # The debsig policy is silently inert if it lands in the wrong key-ID
  # directory, and apt install succeeds either way -- so assert both files
  # exist under the configured ID rather than assuming the ID is right.
  1password-debsig-policy-installed:
    exec: |
      id=$(cat /etc/workstation-debsig/1password)
      test -s "/etc/debsig/policies/${id}/1password.pol" \
        && test -s "/usr/share/debsig/keyrings/${id}/debsig.gpg" \
        && echo installed
    exit-status: 0
    stdout: ["installed"]

  # Exactly one apt declaration of the 1Password origin: the vendor's deb822
  # file, with our bootstrap .list cleaned up in the same converge. A leftover
  # .list is harmless to apt -- the postinst comments it out -- but it ships in
  # every image and makes the first `make apply` on each machine report a
  # change. Fails, too, if a future postinst stops writing .sources: worth
  # hearing about, since the role then keeps our .list as the working source.
  1password-single-apt-source:
    exec: |
      test -s /etc/apt/sources.list.d/1password.sources \
        && test ! -e /etc/apt/sources.list.d/1password.list \
        && echo single
    exit-status: 0
    stdout: ["single"]

  # localsearch's postinst re-applies 30-localsearch.conf by name on every
  # upgrade, which would drop the file-watcher limit to 65536; our same-named
  # file in /etc shadows it. Both halves are asserted: if a future localsearch
  # renames its file, the mask silently guards nothing, and this fails instead.
  inotify-limit-masks-localsearch:
    exec: |
      grep -q '^fs.inotify.max_user_watches' /etc/sysctl.d/30-localsearch.conf \
        && test -e /usr/lib/sysctl.d/30-localsearch.conf \
        && echo masked
    exit-status: 0
    stdout: ["masked"]

  # VS Code must come from apt only. A leftover snap would put a second copy on
  # the image with its own updater, and nothing else here would notice.
  vscode-not-also-a-snap:
    exec: "snap list code >/dev/null 2>&1 && echo duplicate || echo single"
    exit-status: 0
    stdout: ["single"]

  # Base and Math were deliberately excluded: they pull a Java runtime for the
  # report builder, which is a couple of hundred megabytes for features that go
  # unopened. Assert that, so a future edit to the metapackage is a visible
  # decision rather than a silent size regression.
  libreoffice-metapackage-not-installed:
    exec: |
      dpkg-query -W -f='${Status}' libreoffice-base 2>/dev/null \
        | grep -q 'ok installed' && echo present || echo absent
    exit-status: 0
    stdout: ["absent"]

  # BalenaEtcher must never launch without --no-sandbox -- see roles/apps for
  # why. Can't actually launch the GUI in a headless build, so this checks the
  # wrapper structure directly: the real binary was moved aside, a wrapper
  # sits where it used to be, and that wrapper actually names the flag.
  balena-etcher-no-sandbox-wrapper:
    exec: |
      desktop=$(dpkg -L balena-etcher | grep -E '\.desktop$' | head -1)
      exec_line=$(grep -m1 '^Exec=' "$desktop" | sed 's/^Exec=//')
      cmd=$(echo "$exec_line" | awk '{print $1}')
      case "$cmd" in /*) bin="$cmd" ;; *) bin=$(command -v "$cmd") ;; esac
      real=$(readlink -f "$bin")
      test -x "${real}.real" || { echo "no .real binary"; exit 1; }
      grep -q -- '--no-sandbox' "$real" && echo wrapped || echo unwrapped
    exit-status: 0
    stdout: ["wrapped"]

  # Sanity check that GRUB will actually be regenerated correctly.
  grub-config-present:
    exec: "test -f /boot/grub/grub.cfg && echo present"
    exit-status: 0
    stdout: ["present"]

service:
  # display-manager is the stable alias; the concrete unit name has moved
  # between gdm.service and gdm3.service across releases.
  display-manager:
    enabled: true
  docker:
    enabled: true
  workstation-firstboot:
    enabled: true

user:
  # Templated from /etc/workstation-release rather than hardcoded, so renaming
  # workstation_user in group_vars does not silently stop testing anything.
  "{{ .Env.WS_USER }}":
    exists: true
    groups: [sudo, docker, wireshark, kvm]

group:
  docker:
    exists: true
  # Created by wireshark-common's postinst, but ONLY when non-root capture is
  # enabled -- so its absence is the signal that the preseed did not take.
  wireshark:
    exists: true

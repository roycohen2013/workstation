---
# =============================================================================
#  WORKSTATION CONFIGURATION
#
#  This is the file to edit. Everything else in this repo is machinery that
#  turns what is declared here into a bootable image.
#
#  Change something, then either:
#    make image    -> build a fresh image carrying the change
#    make apply    -> converge THIS running machine to it, no reimage needed
# =============================================================================

# --- Identity ----------------------------------------------------------------
workstation_user: roy
workstation_user_fullname: Roy Cohen
workstation_user_shell: /usr/bin/zsh
workstation_user_groups: [sudo, adm, dialout, plugdev, video, audio]

workstation_hostname_default: workstation   # firstboot sets this on new machines
workstation_timezone: America/New_York
workstation_locale: en_US.UTF-8
workstation_keyboard_layout: us

# --- Interactive shell defaults ----------------------------------------------
# Applied to Ubuntu's shipped .bashrc, in /etc/skel (so users created later
# inherit them) and in workstation_user's home (already populated from skel by
# the time this runs). These are shell defaults for the image, distinct from
# personal dotfiles -- roles/dotfiles deliberately pulls those at first login
# rather than baking them in. If chezmoi is later given .bashrc to manage, it
# owns the file and these settings are whatever that repository says.
base_bash_force_color_prompt: true

# Aliases for every interactive shell, bash and zsh alike, written as one
# managed block so that an entry removed from this list also disappears from
# the file. A lineinfile per alias could only ever add one; nothing would
# retract it. bash gets the block in both .bashrc files above; zsh gets it in
# /etc/zsh/zshrc, which every interactive zsh reads before ~/.zshrc -- so a
# personal ~/.zshrc (chezmoi's to own) can still override any of these.
base_shell_aliases:
  - { name: sysinfo, command: fastfetch }

# Print system info at login. This installs /etc/profile.d rather than appending
# to .bashrc, so it fires for login shells -- a TTY, ssh, `bash -l` -- and not
# for every terminal tab. Worth knowing on the desktop: GNOME Terminal opens
# non-login shells by default, so the banner shows up over ssh rather than in
# each new tab. The sysinfo alias above covers that case.
base_fastfetch_on_login: true

# --- Hostname and IP on the desktop -------------------------------------------
# Which machine am I on, answered without opening a terminal. The text is
# stamped onto the wallpaper rather than drawn by a desktop widget, which is
# how Sysinternals BGInfo has always done it on Windows and how BGINFO4X and
# lbginfo do it on Linux.
#
# Not conky, though this repo already installs it: conky is an X11 application
# and this desktop is GNOME on Wayland, where it has open upstream bugs -- the
# window not appearing, right-alignment failing, own_window_type=desktop
# vanishing when the desktop is clicked. Not a GNOME Shell extension either:
# extensions break on every GNOME major version, and a wallpaper does not.
#
# desktop_info_base_wallpaper must stay a PRISTINE source image. The generated
# file is written elsewhere and set as the wallpaper; stamping the current
# wallpaper instead would re-stamp its own output and the text would compound
# on every refresh.
desktop_info_enabled: true
desktop_info_base_wallpaper: /usr/share/backgrounds/warty-final-ubuntu.png
desktop_info_refresh: 2min
desktop_info_font: /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf
desktop_info_pointsize: 32
# Top right. Any ImageMagick gravity works, but corners are the sane choices:
# NorthEast, NorthWest, SouthEast, SouthWest.
desktop_info_gravity: NorthEast
# Inset from that corner, in pixels. Only meaningful because the renderer
# fits the image to the screen first -- see the note in roles/desktop.
desktop_info_inset: 60
# How many times apt retries an individual failed download. Ubuntu ships no
# default, which means zero: one refused connection or DNS blip anywhere in
# sources.list.d fails the whole `apt-get update`, and with it `make apply`.
base_apt_retries: 3
base_bash_histsize: 50000
base_bash_histfilesize: 50000

# Public keys authorised for SSH into this machine. Leave empty to disable
# key-based login. Private keys NEVER belong in this repo or the image.
workstation_authorized_keys: []
# - "ssh-ed25519 AAAA... roy@laptop"

# --- Feature switches --------------------------------------------------------
workstation_desktop_enabled: true
workstation_docker_enabled: true
workstation_flatpak_enabled: true
# Claude Desktop. Linux support is beta (Ubuntu 22.04+/Debian 12+, amd64/arm64).
workstation_claude_desktop_enabled: true
# Claude Code, the terminal agent. Installed from Anthropic's signed apt
# repository rather than the `curl | bash` native installer: that installer
# puts the binary in ONE user's ~/.local/bin and self-updates in the
# background, which is the wrong shape for an image flashed onto many machines
# and used by whoever logs in. The package is system-wide and updates with the
# rest of the system.
workstation_claude_code_enabled: true
# GitHub CLI, from GitHub's own repository rather than the Ubuntu archive.
# The archive carries 2.46.0 against upstream 2.99.0 -- 53 minor versions --
# and gh gains subcommands and flags often enough that scripting against the
# archive build means checking what exists in it first.
workstation_gh_enabled: true
workstation_chrome_enabled: true
workstation_vscode_enabled: true

# BalenaEtcher and Nimbalyst have no apt repository; both are pinned
# downloads, declared in pinned_downloads below with their versions.
workstation_balena_etcher_enabled: true
workstation_1password_enabled: true
workstation_nimbalyst_enabled: true

workstation_firewall_enabled: true
# Live-only: `make apply` turns it on for the machine it runs on. An image
# build refuses it, because the server's hardening cannot be applied while
# Packer is connected over SSH -- see roles/security.
workstation_ssh_server_enabled: false   # laptops rarely want inbound SSH

# Overridden to 'image' by Packer. Defaults to 'live' so `make apply` just works.
workstation_phase: live
workstation_image_version: dev
workstation_build_date: unknown
# Throwaway account Packer uses inside the build VM; roles/seal deletes it
# before export. Declared here so the name lives in one place rather than only
# in the Packer variables and the seal template's fallback.
workstation_build_user: packer

# =============================================================================
#  APPLICATIONS
#
#  Three package sources, all declared as plain data. To add software, add a
#  line -- no role edits required.
# =============================================================================

# --- APT: base system utilities ---------------------------------------------
apps_apt_base:
  - curl
  - wget
  - git
  - git-lfs
  - vim
  - neovim
  - tmux
  - zsh
  - htop
  - btop
  # neofetch was archived upstream in 2024 and dropped from the Ubuntu
  # archive; fastfetch is its actively maintained, packaged successor -- same
  # purpose, drop-in compatible config format.
  - fastfetch
  - tree
  - unzip
  - zip
  - 7zip
  - zstd
  - rsync
  - jq
  - ripgrep
  - fd-find
  - fzf
  - bat
  - ncdu
  - net-tools
  - bind9-dnsutils
  - traceroute
  - nmap
  - tcpdump
  - socat
  - pciutils
  - usbutils
  - lsof
  - strace
  - man-db
  - less
  - ca-certificates
  - gnupg

# --- APT: development --------------------------------------------------------
apps_apt_dev:
  - build-essential
  - pkg-config
  - cmake
  - autoconf
  - automake
  - libtool
  - gettext
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - sqlite3
  - direnv
  - shellcheck
  - make
  # The rest of what `make lint` needs, so a machine built from this image can
  # lint the repo that produced it -- shellcheck and make are already above.
  # ansible-core, not the full `ansible` bundle: it is what provides
  # ansible-playbook, which lint-ansible runs for its syntax check, and this
  # repo installs its collections separately from ansible/requirements.yml.
  # pipx is here for docsible, which is PyPI-only -- see roles/dev.
  - yamllint
  - ansible-lint
  - ansible-core
  - pipx

# --- APT: desktop ------------------------------------------------------------
# Ignored entirely when workstation_desktop_enabled is false.
apps_apt_desktop:
  - ubuntu-desktop-minimal
  - gnome-tweaks
  - gnome-shell-extension-manager
  - dconf-editor
  - fonts-firacode
  - fonts-noto
  - fonts-noto-color-emoji
  - fonts-jetbrains-mono
  - gnome-terminal
  - nautilus
  - eog
  - evince
  - vlc
  - gimp
  # LibreOffice, without the metapackage. libreoffice-core (~151MB) is shared
  # by all of these, so the four apps cost only ~83MB more. The metapackage
  # would additionally pull Base, Math and report-builder-bin, and with them a
  # Java runtime -- a couple of hundred megabytes on every machine flashed from
  # this image, for features most people never open.
  - libreoffice-writer
  - libreoffice-calc
  - libreoffice-impress
  - libreoffice-draw
  - flameshot
  # KDE's remote desktop client (RDP and VNC). krdc is 4MB, but it is the only
  # KDE application here and pulls Qt6 (~28MB) and KDE Frameworks 6 (~25MB)
  # onto an otherwise GNOME desktop -- about 62MB before transitive deps.
  # Recorded here so those libraries are attributable later: without this note,
  # a Qt6 stack on a GNOME image looks like something nobody asked for.
  - krdc
  # Déjà Dup is ~1.8MB, but pulls restic (~25MB) as its backup engine -- version
  # 50 switched to restic from the duplicity it used for years. Its other deps
  # and recommends (gvfs-backends, gvfs-fuse, packagekit, fuse3) are already
  # here via the desktop set, so restic is the whole real cost. Recorded so 25MB
  # of Go binary is attributable later rather than looking unaccounted for.
  #
  # It installs an XDG autostart entry, deja-dup-monitor, which runs per-user
  # and stays inert until someone configures a backup in their own dconf. It
  # ships no systemd unit and writes no machine identity, so nothing needs
  # stripping in roles/seal -- confirmed by inspecting the .deb, not assumed.
  - deja-dup
  - xclip
  - wl-clipboard
  - wireshark
  - tshark
  # Stamping the desktop wallpaper needs a renderer and a font whose path is
  # predictable. fonts-dejavu-core rather than the fonts already declared above
  # because ImageMagick is pointed at a file path, and DejaVuSansMono.ttf has
  # lived at the same place for years.
  - imagemagick
  - fonts-dejavu-core

# Packages to remove (Ubuntu ships a few things you may not want).
apps_apt_absent:
  - popularity-contest
  # Installed here for months and never configured, and it could not have
  # worked anyway: conky is an X11 application and this desktop is GNOME on
  # Wayland, where it has open upstream bugs -- the window not appearing,
  # right-alignment failing, own_window_type=desktop vanishing when the desktop
  # is clicked. Its job here, showing hostname and IP on the desktop, is done
  # by the wallpaper stamp instead (see desktop_info_* above), which is
  # compositor-agnostic. Declared absent rather than merely dropped from
  # apps_apt_base, or machines already converged would keep it forever.
  - conky-all
  # LibreOffice Base and Math are deliberately not installed: they pull a Java
  # runtime for the report builder -- a couple of hundred megabytes for
  # features that go unopened. apps_apt_desktop names the four applications
  # wanted rather than the libreoffice metapackage; declaring Base absent makes
  # that a checked decision rather than a silent size regression waiting for
  # someone to switch to the metapackage.
  - libreoffice-base

# --- APT: third-party repositories -------------------------------------------
# Each entry adds a signed keyring and a sources.list.d entry, then installs its
# packages from it. roles/apt_repos does the work and checks every entry before
# touching anything, so a missing or misspelt field fails the run up front.
#
# - `name`: the entry's name. Our source file is a deb822
#   sources.list.d/workstation-<name>.sources, and the keyring defaults to
#   /etc/apt/keyrings/<name>.gpg. A one-line <name>.list, which older
#   versions wrote, is removed -- except under `vendor_sources`, below.
# - `enabled`: optional feature switch.
# - `key_url`: the vendor's signing key, fetched on every converge so a
#   rotated key is picked up.
# - `key_path`: where the keyring goes, when the vendor documents a path of
#   its own -- see the vendors below for why matching it matters.
# - `key_armoured`: install the key as the .asc the vendor publishes, rather
#   than dearmoured. Needs `key_path`.
# - `repo`: the deb line, as the vendor documents it:
#   `deb [options] uri suite [components]`. It is written out as deb822.
#   Its signed-by must name the keyring path above; anything else is refused,
#   because it fails later as a signature error that reads like a network
#   fault.
# - `vendor_sources`: the vendor's package writes its own deb822 source at
#   sources.list.d/<name>.sources. Our entry then only bootstraps the first
#   install, as the one-line <name>.list the vendor's postinst takes over, and
#   is removed once theirs exists. Without it the origin stays declared
#   twice.
# - `vendor_opt_out`: a setting that stops the vendor's package adding an apt
#   source of its own, as `file`, `setting` and `value`. Written before the
#   package installs, because its postinst reads it.
# - `debsig_key_id` and `debsig_policy_url`: a debsig-verify policy, which
#   checks the .deb's own signature on top of apt's repository signature.
# - `packages`: what to install from it. Never list these in apps_apt_base:
#   apt would try to install them before the repository exists.
apps_apt_repos:
  - name: docker
    enabled: "{{ workstation_docker_enabled }}"
    key_url: https://download.docker.com/linux/ubuntu/gpg
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  - name: claude-desktop
    enabled: "{{ workstation_claude_desktop_enabled }}"
    key_url: https://downloads.claude.ai/claude-desktop/key.asc
    # This vendor documents an exact keyring path, and its package registers
    # its own sources.list.d entry pointing there. Matching it means apt keeps
    # working whichever entry ends up on disk -- see roles/apt_repos.
    key_armoured: true
    key_path: /usr/share/keyrings/claude-desktop-archive-keyring.asc
    # Suite is literally "stable" -- NOT the Ubuntu codename.
    # This repo publishes one suite for all releases, so templating the Ubuntu
    # codename here would 404. Key fingerprint per Anthropic's docs:
    #   31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
    #
    # Word for word the line the package's postinst writes, arch list
    # included, so the two never disagree about the repository.
    repo: >-
      deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc]
      https://downloads.claude.ai/claude-desktop/apt/stable
      stable main
    # Its postinst writes claude-desktop.list, a second declaration of the
    # same origin, whenever that path is free -- which it is, now that ours
    # is deb822. This is the opt-out its postinst documents. The postinst
    # never added a source here before either: it leaves alone a .list it
    # did not write, and ours used to sit at that path.
    vendor_opt_out:
      file: /etc/default/claude-desktop
      setting: CLAUDE_DESKTOP_ADD_REPO
      value: '"false"'
    packages:
      - claude-desktop

  - name: google-chrome
    enabled: "{{ workstation_chrome_enabled }}"
    key_url: https://dl.google.com/linux/linux_signing_key.pub
    # https rather than the http Google documents: apt verifies signatures
    # either way, so this is about not advertising which packages we fetch.
    # Suite is "stable" -- Google publishes one suite for all releases, so
    # the Ubuntu codename would 404 here (same as claude-desktop).
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]
      https://dl.google.com/linux/chrome/deb/
      stable main
    # Chrome's postinst writes google-chrome.sources on a first install,
    # whatever /etc/default/google-chrome says, and keeps it on upgrade. Its
    # URIs is .../linux/chrome-stable/deb/, not this line's: ours only has to
    # last until the package installs.
    vendor_sources: true
    packages:
      - google-chrome-stable

  - name: 1password
    enabled: "{{ workstation_1password_enabled }}"
    key_url: https://downloads.1password.com/linux/keys/1password.asc
    # Dearmoured, but at 1Password's documented path rather than ours.
    key_path: /usr/share/keyrings/1password-archive-keyring.gpg
    # Suite "stable", component "main"; the amd64 archive is its own repo root.
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg]
      https://downloads.1password.com/linux/debian/amd64
      stable main
    # 1Password's postinst writes 1password.sources on every install and
    # upgrade, with the same Signed-By as this line.
    vendor_sources: true
    # The policy lives in a directory named after the long ID of 1Password's
    # signing key, confirmed to match the key they publish. Keep it checked
    # rather than assumed: a wrong value fails silently, because the policy
    # lands where dpkg never looks, stays inert, and apt install succeeds
    # anyway. `make verify-repos` re-verifies it against the published key, so
    # a rotation shows up as a failure instead of as an image that quietly
    # stops validating the packages it installs.
    debsig_key_id: AC2D62742012EA22
    debsig_policy_url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    packages:
      - 1password

  - name: vscode
    enabled: "{{ workstation_vscode_enabled }}"
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    # Microsoft's package registers its own sources.list.d entry. Rather than
    # hunting for the flag that disables that, this entry deliberately matches
    # the layout Microsoft documents -- the keyring at /usr/share/keyrings/
    # microsoft.gpg, and (via name: vscode) the file at vscode.list -- so
    # whichever entry ends up on disk points at a keyring that exists. The
    # NO_PUBKEY failure this avoids only shows up on a later apt update.
    key_path: /usr/share/keyrings/microsoft.gpg
    # Suite and component read from the repo's own Release file, not from docs:
    #   Suite: stable  Components: main  Architectures: amd64 arm64 armhf all
    # Signing key EB3E94ADBE1229CF, "Microsoft (Release signing)".
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg]
      https://packages.microsoft.com/repos/code
      stable main
    packages:
      - code

  - name: claude-code
    enabled: "{{ workstation_claude_code_enabled }}"
    key_url: https://downloads.claude.ai/keys/claude-code.asc
    # Armoured and at the vendor's own path, like claude-desktop above: the key
    # stays a .asc rather than being dearmoured, and signed-by must match.
    key_armoured: true
    key_path: /etc/apt/keyrings/claude-code.asc
    # Suite is literally "stable", NOT the Ubuntu codename -- templating the
    # codename here 404s, the same trap as claude-desktop and google-chrome.
    # "stable" trails releases by about a week and skips ones with major
    # regressions. The "latest" channel changes BOTH the path and the suite
    # (.../apt/latest latest main), so switching is a two-part edit.
    repo: >-
      deb [signed-by=/etc/apt/keyrings/claude-code.asc]
      https://downloads.claude.ai/claude-code/apt/stable
      stable main
    packages:
      - claude-code

  - name: github-cli
    enabled: "{{ workstation_gh_enabled }}"
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    # GitHub publishes a BINARY keyring, not an armoured .asc. The default
    # path here runs `gpg --dearmor` over it, which was checked rather than
    # assumed: dearmouring an already-binary key is a passthrough, byte for
    # byte, so the default handling is correct as-is.
    #
    # key_path is the vendor's documented filename, not this repo's
    # <name>.gpg default. Same lesson as hashicorp: when a vendor documents a
    # keyring path, anything else it or its users install can declare that
    # path for the same origin, and two Signed-By values for one origin make
    # apt refuse to read its source list at all.
    key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    # Suite is "stable" -- GitHub publishes one suite for every release, so
    # the Ubuntu codename would 404 here.
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages
      stable main
    packages:
      - gh

  # Vendor key path, not this repo's default. Packer and Terraform are
  # requirements of this project, so a machine is very likely to have already
  # installed them by following HashiCorp's own instructions -- which write
  # /etc/apt/sources.list.d/hashicorp.list with signed-by pointing at their
  # path. Any other path declares the same origin with a second key, and apt
  # then refuses to read its source list at all:
  #   E:Conflicting values set for option Signed-By regarding source
  #   https://apt.releases.hashicorp.com/ ... E:The list of sources could not
  #   be read.
  # roles/apt_repos removes hashicorp.list on every converge, but following
  # those instructions again writes it back; matching their documented layout
  # keeps that harmless until then. The key itself is the same either way --
  # verified byte-identical (sha256) at both paths.
  - name: hashicorp
    enabled: true
    key_url: https://apt.releases.hashicorp.com/gpg
    key_path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]
      https://apt.releases.hashicorp.com
      {{ ansible_facts['distribution_release'] }} main
    packages:
      - packer
      - terraform

# --- Pinned downloads --------------------------------------------------------
# Software with no apt repository, snap or flatpak, fetched from a release URL
# instead. Each entry is pinned by version and checksum: a release URL alone
# verifies nothing, and a checksum mismatch fails the download outright rather
# than installing something unverified. Bump deliberately, the same way
# dev_mise_runtimes is bumped, and check the new pin with
# `python3 scripts/verify-repos.py --checksums` before building.
#
# roles/pinned_downloads installs every entry; `make verify-repos` checks every
# entry still exists. Adding one here is all either of them needs. Whatever an
# entry needs after it installs -- a wrapper, a desktop entry -- stays in the
# role that owns that app (roles/apps for both desktop apps).
#
# - `name`: the entry's name, and the deb package or tarball member to install
#   unless `package` or `binary` says otherwise.
# - `enabled`: optional feature switch, as in apps_apt_repos.
# - `kind`: `deb` installs with apt, so its dependencies resolve, then deletes
#   the .deb; the installed version decides whether to fetch it again.
#   `tarball` extracts one binary into /usr/local/bin and deletes the archive;
#   `<binary> --version` decides. `appimage` is kept at `dest`; the checksum of
#   what is already there decides, so a converge never re-fetches it.
# - `version`: substituted for every {version} in `url`, so a bump is one line.
# - `checksum`: `<algorithm>:<hex>`, as ansible.builtin.get_url takes it.
pinned_downloads:
  # BalenaEtcher: no apt repository exists in current vendor documentation --
  # checked 2026-08 against github.com/balena-io/etcher's README, which only
  # describes downloading a versioned .deb and running
  # `apt install ./balena-etcher_*_amd64.deb`, which is what kind: deb does.
  - name: balena-etcher
    enabled: "{{ workstation_balena_etcher_enabled | bool and workstation_desktop_enabled | bool }}"
    kind: deb
    version: "2.1.7"
    url: >-
      https://github.com/balena-io/etcher/releases/download/v{version}/balena-etcher_{version}_amd64.deb
    # From the release's combined SHA256SUMS.Linux.x64.txt.
    checksum: sha256:9dbea6165ddee1ec1f1b7a38fe92f0d2c54c6217710438a7af6752c267d19395

  # Nimbalyst: an open-source visual workspace for coding agents (Claude Code,
  # Codex, OpenCode). Linux ships as an AppImage and nothing else -- no apt
  # repository, no snap, no flatpak -- confirmed against their README, which
  # links the AppImage as the only Linux download.
  #
  # ~470MB, the largest single thing in this image -- more than the four
  # LibreOffice applications combined. Recorded here so that weight is
  # attributable later rather than looking unaccounted for.
  #
  # v0.75.5 is the current STABLE release. The newer v0.76.0 is marked
  # prerelease; the app also has its own alpha channel, switchable in
  # Settings -> Advanced.
  #
  # Note their telemetry is on by default: anonymous usage analytics to
  # PostHog, correlated by a random per-install ID. That ID is generated per
  # user on first run, not at install, so nothing machine-specific is baked
  # into the image and roles/seal needs no change. Opting out is a GUI setting
  # (Settings -> Advanced -> Analytics), so it cannot be disabled declaratively.
  - name: nimbalyst
    enabled: "{{ workstation_nimbalyst_enabled }}"
    kind: appimage
    version: "0.75.5"
    url: >-
      https://github.com/nimbalyst/nimbalyst/releases/download/v{version}/Nimbalyst-Linux.AppImage
    dest: /opt/nimbalyst/Nimbalyst.AppImage
    # From the release's own latest-linux.yml, which electron-builder publishes
    # as base64; converted to the hex get_url expects and length-checked at 128.
    checksum: >-
      sha512:0b86fc9b173d633530d6b6e8782d99c8a447a82db8b5dae6fd2f3ee5c74576aa3c6bdcac230755fab54558b82fe212b42ff25ea1cc5201cc9708e5771432d995

  # terraform-docs generates the tables in docs/terraform.md. Not packaged for
  # Ubuntu and not on PyPI.
  #
  # The pin is load-bearing beyond supply chain. `make lint-docs` regenerates
  # the committed docs and fails if anything moved, so a version that formats
  # its tables even slightly differently turns into a red build on a machine
  # that happened to install a newer one. CI's lint job reads this same entry,
  # so the two cannot drift apart. Bump it deliberately, then run
  # `make docs-config` and commit the regenerated output in the same change.
  - name: terraform-docs
    kind: tarball
    version: "0.24.0"
    url: >-
      https://github.com/terraform-docs/terraform-docs/releases/download/v{version}/terraform-docs-v{version}-linux-amd64.tar.gz
    # From the release's own terraform-docs-v<version>.sha256sum.
    checksum: sha256:9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3

# --- Snap --------------------------------------------------------------------
# Empty by design. VS Code used to be installed here as a classic snap; it now
# comes from Microsoft's apt repository instead (see apps_apt_repos above), and
# keeping both would put two independent copies on the image, each with its own
# update mechanism and its own ~300MB.
apps_snap: []

# --- Flatpak (flathub) -------------------------------------------------------
apps_flatpak:
  # Obsidian, from Flathub rather than the official .deb. The .deb is 102MB and
  # would need an entry in pinned_downloads -- a fourth pin to bump by hand, on
  # an app that releases often.
  # The flatpak needs no version and updates itself, and the sandbox is not in
  # the way: Flathub's manifest already grants home, /media, /mnt and
  # /run/media, so vaults are reachable, plus a wayland socket and
  # org.freedesktop.secrets for sync credentials.
  #
  # Note for anyone automating against their releases: obsidianmd's
  # /releases/latest returns the ANDROID APK, because mobile and desktop ship
  # from one repository. The desktop assets live on a different tag.
  - md.obsidian.Obsidian
  - com.spotify.Client
  - org.signal.Signal

# --- Language runtimes, via mise ---------------------------------------------
# mise installs per-user toolchains without polluting the system, and pins
# versions in one place. Set to {} to skip.
dev_mise_enabled: true
dev_mise_runtimes:
  node: lts
  python: "3.13"
  go: latest
  rust: latest

# Whether to download the runtimes above during a converge, as opposed to just
# declaring them. Separated because they are different kinds of thing: the
# declaration is configuration this repo owns, the download is several hundred
# megabytes pulled from four upstreams that can be slow or briefly broken for
# reasons that say nothing about whether this config is right.
#
# CI sets this false. Its apply job exists to prove the playbook converges and
# settles, and it was instead spending most of its runtime fetching toolchains
# and then failing on `mise install core:python` with a filesystem permission
# error specific to the runner image -- a red build that told you nothing.
# Left true everywhere else, so a real converge still installs them.
dev_mise_install_runtimes: true

# =============================================================================
#  DOTFILES
#
#  Managed with chezmoi. The image ships the chezmoi binary only -- the repo
#  is pulled on first login, so nothing personal is baked into a flashable
#  artifact and the same image is safe to share or re-flash anywhere.
# =============================================================================
dotfiles_enabled: true
dotfiles_repo: ""            # e.g. https://github.com/roycohen2013/dotfiles.git
dotfiles_apply_on_login: true

# =============================================================================
#  DESKTOP SETTINGS (GNOME, via dconf)
#
#  Applied for workstation_user. Values are GVariant literals, so strings need
#  their own inner quotes: "'prefer-dark'".
# =============================================================================
desktop_dconf:
  - { key: /org/gnome/desktop/interface/color-scheme, value: "'prefer-dark'" }
  - { key: /org/gnome/desktop/interface/gtk-theme, value: "'Yaru-dark'" }
  - { key: /org/gnome/desktop/interface/monospace-font-name, value: "'JetBrains Mono 11'" }
  - { key: /org/gnome/desktop/interface/clock-show-seconds, value: "true" }
  - { key: /org/gnome/desktop/interface/clock-show-weekday, value: "true" }
  - { key: /org/gnome/desktop/interface/show-battery-percentage, value: "true" }
  - { key: /org/gnome/desktop/peripherals/touchpad/tap-to-click, value: "true" }
  - { key: /org/gnome/desktop/peripherals/touchpad/natural-scroll, value: "true" }
  - { key: /org/gnome/desktop/peripherals/mouse/natural-scroll, value: "true" }
  - { key: /org/gnome/desktop/wm/preferences/focus-mode, value: "'click'" }
  - { key: /org/gnome/mutter/dynamic-workspaces, value: "false" }
  - { key: /org/gnome/desktop/wm/preferences/num-workspaces, value: "4" }
  - { key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type, value: "'nothing'" }
  - { key: /org/gnome/desktop/screensaver/lock-enabled, value: "true" }
  - { key: /org/gnome/desktop/session/idle-delay, value: "uint32 300" }

# Automatic login. Convenient on a personal laptop, weak on a stolen one.
desktop_autologin: false

# Let the workstation user capture packets without sudo.
#
# wireshark-common asks this via debconf and defaults to FALSE, so an
# unattended install produces a Wireshark that cannot capture as your user --
# and no 'wireshark' group to join, because postinst only creates that group
# when this is enabled. Setting it preseeds the answer and adds the user to
# the group.
#
# The tradeoff, in Debian's own words: dumpcap becomes setuid/setcap, which
# "may be a security risk". It is still the option Debian recommends over
# running the whole GUI as root. Set false to ship the stock behaviour, where
# capture requires elevation.
desktop_wireshark_capture_as_user: true

# =============================================================================
#  SECURITY
# =============================================================================
security_ufw_default_incoming: deny
security_ufw_default_outgoing: allow
security_ufw_allow: []       # e.g. [{ port: 22, proto: tcp, comment: ssh }]
security_unattended_upgrades: true
security_unattended_reboot: false

# =============================================================================
#  SYSTEM TUNING
# =============================================================================
base_zram_enabled: true
base_zram_percent: 50
base_sysctl:
  vm.swappiness: 10
  vm.max_map_count: 262144           # Electron apps, some games, ES
  fs.inotify.max_user_watches: 524288 # file watchers in editors/bundlers
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr

# =============================================================================
#  HARDWARE (laptop)
#
#  Installed in every image, including VM builds, because the image is
#  meant to be flashable onto metal. firstboot decides at runtime whether to
#  actually enable the power/thermal services.
# =============================================================================
hardware_packages:
  - fwupd
  - tlp
  - tlp-rdw
  - thermald
  - powertop
  - linux-firmware
  - intel-microcode
  - amd64-microcode
  - bluez
  - blueman

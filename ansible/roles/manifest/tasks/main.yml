---
# Records what actually ended up in this image, and fails the build if it does
# not match what group_vars declared.
#
# ORDERING: this role must run BEFORE roles/seal. seal deletes
# /var/lib/apt/lists, and those indexes are the only source for which
# repository a package came from. Run it after seal and the origin data goes
# quietly missing rather than erroring -- see site.yml, where the ordering is
# commented.

# The capture only reads the machine, so it also runs under `make apply-check`
# -- into a scratch file, leaving the real manifest alone. Skipped there, as
# script tasks are by default, this role went on to judge whatever manifest
# the last converge left behind, or failed outright on a machine without one.
- name: Capture the installed inventory
  ansible.builtin.script:
    cmd: >-
      capture-manifest.py
      {{ manifest_check_path if ansible_check_mode else '/etc/workstation-manifest.json' }}
  changed_when: false
  check_mode: false
  register: manifest_capture

- name: Report what was captured
  ansible.builtin.debug:
    msg: "{{ manifest_capture.stdout_lines | default([]) }}"

- name: Read the manifest back
  ansible.builtin.slurp:
    src: "{{ manifest_check_path if ansible_check_mode else '/etc/workstation-manifest.json' }}"
  register: manifest_raw

- name: Remove the check-mode inventory
  ansible.builtin.file:
    path: "{{ manifest_check_path }}"
    state: absent
  check_mode: false
  changed_when: false
  when: ansible_check_mode

- name: Parse the manifest
  ansible.builtin.set_fact:
    manifest_data: "{{ manifest_raw.content | b64decode | from_json }}"

# --- Declared vs actual -------------------------------------------------------
# The whole point of the manifest. Without this, a package that silently failed
# to install ships in the image and nobody finds out until they go looking for
# it on a running machine.
#
# This is the one place the declared set is assembled. It is written to
# /etc/workstation-declared.json below, and everything else that needs it --
# the image tests in tests/goss, the HTML report -- reads that file rather
# than keeping its own copy of what group_vars says.

# A pinned download of kind deb is an apt package once installed, so it is
# declared like one -- under its package name, which may differ from its name.
- name: Collect the packages pinned downloads install
  ansible.builtin.set_fact:
    manifest_pinned_debs: "{{ manifest_pinned_debs | default([]) + [item.package | default(item.name)] }}"
  loop: "{{ pinned_downloads_enabled | default([]) | selectattr('kind', 'equalto', 'deb') | list }}"
  loop_control:
    label: "{{ item.name }}"

# The keyring path defaults per entry (key_path, else /etc/apt/keyrings/<name>.gpg),
# which map() cannot express, so it is resolved here the way roles/apt_repos
# resolves it.
- name: Collect the keyrings and debsig policies the enabled repositories install
  ansible.builtin.set_fact:
    manifest_repo_keyrings: >-
      {{ manifest_repo_keyrings | default([])
         + [item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg')] }}
    manifest_repo_debsig: >-
      {{ manifest_repo_debsig | default([])
         + ([{'name': item.name, 'key_id': item.debsig_key_id}]
            if item.debsig_key_id is defined else []) }}
  loop: "{{ apt_repos_enabled | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# Each entry mirrors the gate its producing role applies -- desktop packages and
# dconf keys only with the desktop, flatpaks only where roles/apps installs them
# -- so the record states what this machine should have, already resolved.
# tests/goss turns it into checks without re-deriving any of it: the templates
# there only switch on `features` and loop over lists.
- name: Assemble the declared set
  ansible.builtin.set_fact:
    manifest_declared:
      schema: 2
      user: "{{ workstation_user }}"
      # A minimum: base adds groups with append and never removes one, so a
      # lived-in machine legitimately carries others.
      user_groups: >-
        {{ (workstation_user_groups
            + (['docker'] if workstation_docker_enabled | bool else [])
            + (['wireshark'] if workstation_desktop_enabled | bool
                and desktop_wireshark_capture_as_user | bool else [])
            + (['kvm'] if workstation_claude_desktop_enabled | bool else [])
           ) | unique | sort }}
      features:
        desktop: "{{ workstation_desktop_enabled | bool }}"
        docker: "{{ workstation_docker_enabled | bool }}"
        claude_desktop: "{{ workstation_claude_desktop_enabled | bool }}"
        balena_etcher: >-
          {{ workstation_balena_etcher_enabled | bool and workstation_desktop_enabled | bool }}
        wireshark_capture: >-
          {{ workstation_desktop_enabled | bool and desktop_wireshark_capture_as_user | bool }}
        ssh_server: "{{ workstation_ssh_server_enabled | bool }}"
        fastfetch_banner: "{{ base_fastfetch_on_login | bool }}"
      dconf: "{{ desktop_dconf if workstation_desktop_enabled | bool else [] }}"
      sysctl: "{{ base_sysctl | dict2items }}"
      aliases: "{{ base_shell_aliases }}"
      keyrings: "{{ manifest_repo_keyrings | default([]) | sort }}"
      # Repositories whose vendor's .sources file replaces ours after install:
      # exactly one declaration of each must remain. See roles/apt_repos.
      vendor_sources: >-
        {{ apt_repos_enabled | default([]) | selectattr('vendor_sources', 'defined')
           | selectattr('vendor_sources') | map(attribute='name') | sort }}
      # Every other enabled repository keeps our deb822 source, and the
      # one-line .list an older roles/apt_repos wrote must be gone.
      own_sources: >-
        {{ apt_repos_enabled | default([]) | map(attribute='name')
           | difference(apt_repos_enabled | default([])
                        | selectattr('vendor_sources', 'defined')
                        | selectattr('vendor_sources') | map(attribute='name'))
           | sort }}
      debsig: "{{ manifest_repo_debsig | default([]) }}"
      apt: >-
        {{ (apps_apt_base
            + apps_apt_dev
            + (apps_apt_desktop if workstation_desktop_enabled | bool else [])
            + hardware_packages
            + (apt_repos_enabled | default([]) | map(attribute='packages') | flatten | list)
            + manifest_pinned_debs | default([])
           ) | unique | sort }}
      flatpak: >-
        {{ (apps_flatpak
            if workstation_flatpak_enabled | bool and workstation_desktop_enabled | bool
            else []) | sort }}
      snap: "{{ apps_snap | map(attribute='name') | sort }}"
      absent: "{{ apps_apt_absent | sort }}"

# Compared against satisfied_names rather than real package names alone, so a
# declared name that only another package Provides is not misreported as
# missing -- it is reported below as what it is instead. See the Provides
# handling in capture-manifest.py.
- name: Identify declared packages missing from the image
  ansible.builtin.set_fact:
    manifest_missing:
      apt: "{{ manifest_declared.apt | difference(manifest_data.satisfied_names) }}"
      flatpak: >-
        {{ manifest_declared.flatpak
           | difference(manifest_data.packages.flatpak | map(attribute='id')) }}
      snap: >-
        {{ manifest_declared.snap
           | difference(manifest_data.packages.snap | map(attribute='name')) }}

# A declared name must be a real package. One that only exists because another
# package Provides it -- a transitional name a release dropped, as p7zip-full
# and dnsutils were in 26.04 -- still installs, since apt resolves it, but
# nothing that asks dpkg about the name itself can see it: the image tests in
# tests/goss fail on it, after a converge that reported success. Failing here
# names the package to declare instead.
- name: Identify declared packages that only another package provides
  ansible.builtin.set_fact:
    manifest_provided_only: >-
      {{ manifest_declared.apt
         | difference(manifest_data.packages.apt | map(attribute='name'))
         | intersect(manifest_data.satisfied_names) }}

- name: Identify packages that were declared for removal but are still present
  ansible.builtin.set_fact:
    manifest_not_removed: >-
      {{ manifest_declared.absent | intersect(manifest_data.satisfied_names) }}

# In check mode the inventory is the machine before this run, so what is
# missing is what `make apply` would install: reported, not failed on.
- name: Report what this run would install or remove
  ansible.builtin.debug:
    msg: >-
      Declared but not installed yet:
      {{ (manifest_missing.apt + manifest_missing.flatpak + manifest_missing.snap) | join(', ') or 'none' }}.
      Declared absent but still present: {{ manifest_not_removed | join(', ') or 'none' }}.
  when: ansible_check_mode

- name: Fail the build when a declared package is not installed
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - manifest_missing.apt | length == 0
      - manifest_missing.flatpak | length == 0
      - manifest_missing.snap | length == 0
      - manifest_provided_only | length == 0
      - manifest_not_removed | length == 0
    fail_msg: >-
      Image does not match what group_vars declares.
      {% for kind in ['apt', 'flatpak', 'snap'] if manifest_missing[kind] | length %}
      Declared {{ kind }} but NOT installed: {{ manifest_missing[kind] | join(', ') }}.
      Check it exists for this release --
      .claude/skills/config-change/scripts/verify-change.sh {{ kind }}
      {{ manifest_missing[kind] | join(' ') }}
      {% endfor %}
      {% for name in manifest_provided_only %}
      Declared apt name {{ name }} is not a real package: it is only provided by
      {{ manifest_data.packages.apt | selectattr('provides', 'contains', name)
         | map(attribute='name') | join(', ') }}. Declare that instead.
      {% endfor %}
      {% if manifest_not_removed | length %}
      Declared in apps_apt_absent but still present:
      {{ manifest_not_removed | join(', ') }}.
      {% endif %}
    success_msg: >-
      All {{ manifest_declared.apt | length }} declared apt packages,
      {{ manifest_declared.flatpak | length }} flatpaks and
      {{ manifest_declared.snap | length }} snaps are installed
      ({{ manifest_data.counts.apt_total }} apt packages total,
      {{ manifest_data.counts.apt_auto }} pulled in as dependencies).

# Written separately rather than merged into the manifest so the capture script
# stays a pure inventory of the machine, with no notion of what was intended.
# render-docs.py joins the two, and run-goss.sh feeds this file to goss as its
# vars, so the image tests assert the same set this role checked.
- name: Record the declared set alongside the manifest
  ansible.builtin.copy:
    content: "{{ manifest_declared | to_nice_json }}\n"
    dest: /etc/workstation-declared.json
    mode: "0644"

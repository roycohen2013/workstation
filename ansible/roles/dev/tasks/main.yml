---
- name: Install development packages
  ansible.builtin.apt:
    name: "{{ apps_apt_dev }}"
    state: present

# fd and bat ship under alternate binary names on Debian/Ubuntu to avoid
# clashes; link them to the names everyone actually types.
- name: Link Debian-renamed binaries to their upstream names
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: /usr/bin/fdfind, dest: /usr/local/bin/fd }
    - { src: /usr/bin/batcat, dest: /usr/local/bin/bat }
  failed_when: false

# --- Repo tooling -------------------------------------------------------------
# The rest of what `make lint` needs is apt data in apps_apt_dev. docsible is
# not: it generates the per-role README files that `make lint-docs` checks for
# staleness, and it is published on PyPI only. Ubuntu's Python is externally
# managed (PEP 668), so a plain `pip install` refuses to run at all -- hence
# pipx, which builds it an isolated venv.
#
# --global is the part that matters. Without it pipx installs into the calling
# user's ~/.local/bin, and this image is flashed onto machines rather than
# built per-user: a tool in one home directory is off PATH for everyone else,
# and disappears with that home if the user is recreated. --global puts the
# venv in /opt/pipx and links the app into /usr/local/bin instead -- confirmed
# against pipx 1.8.0's own --help, the version resolute ships, rather than
# assumed from current docs.
- name: Install docsible
  ansible.builtin.command:
    cmd: pipx install --global docsible
    creates: /usr/local/bin/docsible

# terraform-docs is neither in the Ubuntu archive nor on PyPI, so it is
# fetched as a pinned release tarball. checksum: makes a tampered or truncated
# download fail the task outright rather than unpacking something unverified.
# Same gate as BalenaEtcher, for the same reason: the archive is downloaded and
# then deleted, so without a version check this task and the two after it
# reported changed on every converge. `terraform-docs --version` prints
# "terraform-docs version v0.24.0 <sha> linux/amd64", so the pinned version is
# matched as a substring rather than parsed.
- name: Check the installed terraform-docs version
  ansible.builtin.command:
    cmd: terraform-docs --version
  register: dev_tfdocs_installed
  changed_when: false
  failed_when: false

- name: Download terraform-docs
  ansible.builtin.get_url:
    url: "{{ dev_terraform_docs_url }}"
    dest: "/tmp/terraform-docs-{{ dev_terraform_docs_version }}.tar.gz"
    checksum: "sha256:{{ dev_terraform_docs_sha256 }}"
    mode: "0644"
  when: "'v' ~ dev_terraform_docs_version not in dev_tfdocs_installed.stdout | default('')"

# The tarball holds the bare binary at its root, so extra=... would scatter
# LICENSE and README into /usr/local/bin alongside it.
- name: Install terraform-docs
  ansible.builtin.unarchive:
    src: "/tmp/terraform-docs-{{ dev_terraform_docs_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - terraform-docs
    owner: root
    group: root
    mode: "0755"
  when: "'v' ~ dev_terraform_docs_version not in dev_tfdocs_installed.stdout | default('')"

- name: Remove the downloaded terraform-docs archive
  ansible.builtin.file:
    path: "/tmp/terraform-docs-{{ dev_terraform_docs_version }}.tar.gz"
    state: absent
  when: "'v' ~ dev_terraform_docs_version not in dev_tfdocs_installed.stdout | default('')"

# --- Docker -------------------------------------------------------------------
- name: Add user to the docker group
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: docker
    append: true
  when: workstation_docker_enabled | bool

- name: Enable docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: "{{ 'started' if workstation_phase == 'live' else omit }}"
  when: workstation_docker_enabled | bool

# --- Language runtimes --------------------------------------------------------
# mise keeps toolchains in the user's home rather than the system, so runtime
# versions can be bumped without a rebuild -- and so the image stays generic.
- name: Install mise
  ansible.builtin.get_url:
    url: https://mise.run
    dest: /tmp/mise-install.sh
    mode: "0755"
  when: dev_mise_enabled | bool

- name: Run mise installer
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: sh /tmp/mise-install.sh
    creates: "/home/{{ workstation_user }}/.local/bin/mise"
  environment:
    MISE_QUIET: "1"
  when: dev_mise_enabled | bool

# Must run BEFORE the copy below: ansible.builtin.copy does not create missing
# parent directories, and mise's installer does not create ~/.config/mise
# until it is actually invoked -- which "Run mise installer" above does not
# do. Copying config.toml first fails with "Destination directory ... does
# not exist" on exactly the fresh install this role is meant for.
- name: Ensure mise config directory exists
  ansible.builtin.file:
    path: "/home/{{ workstation_user }}/.config/mise"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0755"
  when: dev_mise_enabled | bool

- name: Declare global runtime versions
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/dev) -- edit dev_mise_runtimes in group_vars
      [tools]
      {% for name, version in dev_mise_runtimes.items() %}
      {{ name }} = "{{ version }}"
      {% endfor %}
    dest: "/home/{{ workstation_user }}/.config/mise/config.toml"
    mode: "0644"
  when: dev_mise_enabled | bool

# Toolchain downloads are large and version-sensitive. Installing them at
# first login instead of build time keeps the image smaller and means a stale
# image still lands on current runtimes.
- name: Install runtimes now (live phase only)
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: "/home/{{ workstation_user }}/.local/bin/mise install --yes"
  register: dev_mise_install
  changed_when: "'installing' in dev_mise_install.stdout | lower"
  when:
    - dev_mise_enabled | bool
    - workstation_phase == 'live'
    - dev_mise_install_runtimes | bool

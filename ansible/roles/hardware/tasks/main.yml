---
# Laptop hardware support.
#
# These packages are installed into EVERY image, VM builds included, because
# the image is meant to be flashable onto metal -- a VM-built image
# missing linux-firmware is a laptop with no Wi-Fi. What is conditional is
# whether the power and thermal *services* run: decided here on a live machine,
# and by the first-boot step tasks/seal.yml installs on a flashed one.

- name: Install hardware support packages
  ansible.builtin.apt:
    name: "{{ hardware_packages }}"
    state: present

- name: Detect virtualisation
  ansible.builtin.set_fact:
    hardware_is_virtual: "{{ ansible_facts['virtualization_role'] | default('host') == 'guest' }}"

- name: Set power management service state
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ not hardware_is_virtual }}"
    state: "{{ 'started' if not hardware_is_virtual else 'stopped' }}"
  loop:
    - tlp
    - thermald
  when: workstation_phase == 'live'
  failed_when: false

# In the image they are left disabled, and the target machine's first boot
# decides -- both in tasks/seal.yml, which roles/seal runs.

---
# Third-party APT repositories and the packages installed from them. Driven
# entirely by apps_apt_repos in group_vars/all.yml, where every field is
# documented -- adding a repository should never mean editing this role.
#
# Each entry goes through the same lifecycle, in this order:
#   1. its signing key is fetched, cached, and installed at its keyring path
#   2. lines it used to declare (repo_replaces) are removed
#   3. its source line is added -- unless the vendor's own .sources file has
#      already taken over (vendor_sources)
#   4. its debsig policy is installed, if it declares one
#   5. its packages are installed, at the repository's latest version
#   6. our bootstrap .list is removed wherever the vendor's .sources replaced it

# Checked up front, for every entry including disabled ones, so a malformed
# entry fails here with its name -- not as a NO_PUBKEY or a signature error
# halfway through a run, or not at all until someone switches it on.
#
# The signed-by check is the one that matters most. The keyring path is
# derived from the entry (key_path, else /etc/apt/keyrings/<name>.gpg), and a
# repo line pointing anywhere else produces a signature error that reads like
# a network fault.
- name: Check each repository entry is complete
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.key_url is defined
      - item.repo is defined
      - item.packages | default([]) | length > 0
      - item.keys() | difference(apt_repos_fields) | length == 0
      - not (item.key_armoured | default(false) | bool) or item.key_path is defined
      - (item.debsig_key_id is defined) == (item.debsig_policy_url is defined)
      - >-
        item.repo | default('') is search('signed-by=' ~ (item.key_path
        | default('/etc/apt/keyrings/' ~ item.name | default('') ~ '.gpg')
        | regex_escape) ~ '[] ]')
    fail_msg: >-
      apps_apt_repos entry '{{ item.name | default('?') }}' is malformed.
      It needs name, key_url, repo and a non-empty packages list, and may
      only use the fields {{ apt_repos_fields | join(', ') }}
      (unknown: {{ item.keys() | difference(apt_repos_fields) | join(', ') or 'none' }}).
      key_armoured needs an explicit key_path; debsig_key_id and
      debsig_policy_url go together; and the repo line must say
      signed-by={{ item.key_path | default('/etc/apt/keyrings/' ~ item.name | default('?') ~ '.gpg') }},
      the keyring path this entry installs.
    quiet: true
  loop: "{{ apps_apt_repos }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Ensure keyring directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /usr/share/keyrings

# `enabled` is usually a template referencing a feature switch, which renders
# to a string. selectattr() would truth-test that string, and a non-empty
# "False" is truthy -- silently enabling a repository that is switched off.
# An explicit `| bool` is the only reliable test here.
- name: Select enabled repositories
  ansible.builtin.set_fact:
    apt_repos_enabled: "{{ apt_repos_enabled + [item] }}"
  loop: "{{ apps_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(true) | bool

- name: Note which enabled repositories carry a debsig policy
  ansible.builtin.set_fact:
    apt_repos_debsig: "{{ apt_repos_enabled | selectattr('debsig_key_id', 'defined') | list }}"

# Keys are dearmoured into /etc/apt/keyrings and referenced per-repo with
# signed-by, rather than added to the deprecated global trusted keyring where
# any one vendor key would be trusted to sign any package.
# Kept, not deleted afterwards, and out of /tmp. get_url compares an existing
# file against what it fetches and reports ok when they match -- but only if
# the file is still there. Deleting it made this task, and the dearmour and
# apt_repository tasks below it, report changed on every single converge; the
# CI idempotence pass is what surfaced that. /var/cache rather than /tmp so it
# also survives a reboot. This is public key material, a few KB per vendor.
- name: Ensure the key cache exists
  ansible.builtin.file:
    path: /var/cache/workstation/keys
    state: directory
    mode: "0755"

# Retried rather than left to fail: get_url contacts every one of these URLs
# on every converge to compare against the cached copy, so a single vendor
# host blinking -- one DNS EAI_AGAIN out of eight -- failed the whole run.
# Deliberately NOT falling back to the cached key when a host stays
# unreachable: that would silently keep using a key the vendor may have
# rotated or revoked, which is the one failure here worth being loud about.
- name: Fetch repository signing keys
  ansible.builtin.get_url:
    url: "{{ item.key_url }}"
    dest: "/var/cache/workstation/keys/{{ item.name }}.asc"
    mode: "0644"
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  register: apt_repos_key_fetch
  until: apt_repos_key_fetch is succeeded
  retries: 3
  delay: 5

# Key handling is two independent choices, because vendors differ on both:
#   key_path     where the keyring lands (default: /etc/apt/keyrings/<name>.gpg)
#   key_armoured whether to copy the .asc verbatim or dearmour it first
#
# It matters because several vendors' packages register their own
# sources.list.d entry naming a keyring path of their choosing -- if that file
# does not exist, every later apt update fails with NO_PUBKEY. Matching the
# vendor's documented layout keeps apt working whichever entry wins.
#   docker:           defaults (dearmoured, our path)
#   claude-desktop:   armoured, vendor path
#   1password:        dearmoured, vendor path
#   hashicorp:        dearmoured, vendor path -- see the note in group_vars
#
# Dearmoured into the cache on every converge, then copied into place, so the
# installed keyring follows the fetched key. This used to dearmour straight to
# the keyring with `creates:`, which skipped it whenever the keyring existed:
# when HashiCorp rotated its signing key, get_url refreshed the cached .asc but
# the keyring stayed on the old key, and every apt update on machines
# converged before the rotation failed with NO_PUBKEY. Dearmouring is
# deterministic, so the copy reports a change only when the key really did.
- name: Dearmour repository signing keys into the cache
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /var/cache/workstation/keys/{{ item.name }}.gpg
      /var/cache/workstation/keys/{{ item.name }}.asc
  changed_when: false
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.key_armoured | default(false) | bool)

- name: Install repository signing keys (dearmoured)
  ansible.builtin.copy:
    src: "/var/cache/workstation/keys/{{ item.name }}.gpg"
    dest: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
    remote_src: true
    mode: "0644"
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.key_armoured | default(false) | bool)

- name: Install repository signing keys (armoured, verbatim)
  ansible.builtin.copy:
    src: "/var/cache/workstation/keys/{{ item.name }}.asc"
    dest: "{{ item.key_path }}"
    remote_src: true
    mode: "0644"
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key_armoured | default(false) | bool

- name: Set keyring permissions
  ansible.builtin.file:
    path: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
    mode: "0644"
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# Some vendors' postinst replaces the source this role declares with its own
# deb822 file, /etc/apt/sources.list.d/<name>.sources, and then disables ours:
# 1Password comments out our .list, Chrome deletes it. Either way, re-adding
# ours on the next converge only restarts the fight, and CI's idempotence pass
# reported "Add repositories" changed on every run because of it.
#
# Our entry is only needed to bootstrap: once the vendor's .sources exists it
# is authoritative and ours is redundant. So entries marked vendor_sources in
# group_vars stop being declared here once that file exists, and our leftover
# .list is removed after the packages install, below -- leaving exactly one
# declaration of each origin.
- name: Check which vendors already manage their own apt source
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item.name }}.sources"
  loop: "{{ apt_repos_enabled | selectattr('vendor_sources', 'defined') | selectattr('vendor_sources') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: apt_repos_vendor_sources

- name: Note which vendors own their apt source
  ansible.builtin.set_fact:
    apt_repos_vendor_owned: >-
      {{ apt_repos_vendor_sources.results | selectattr('stat.exists')
         | map(attribute='item.name') | list }}

# Before adding: apt_repository matches lines exactly, so a changed `repo`
# would otherwise be appended next to the line it replaces.
- name: Remove repository lines an entry no longer declares
  ansible.builtin.apt_repository:
    repo: "{{ item.1 }}"
    filename: "{{ item.0.name }}"
    state: absent
    update_cache: false
  loop: "{{ apt_repos_enabled | subelements('repo_replaces', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Add repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
    # Refresh inline rather than in a separate changed-gated task: the very
    # next task installs from these repositories, and a handler would not run
    # until the end of the play -- far too late.
    update_cache: true
  loop: "{{ apt_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in apt_repos_vendor_owned

# debsig-verify policies, for entries that declare debsig_key_id. Where apt
# verifies the repository, debsig verifies the .deb's own signature -- so the
# policy has to be in place before the package installs, not after.
#
# If debsig_key_id is wrong, these files land in a directory dpkg never
# consults and the policy is silently inert. apt install still succeeds, which
# is why goss asserts the paths and `make verify-repos` checks the id against
# the published key, rather than trusting either.
- name: Create debsig directories
  ansible.builtin.file:
    path: "{{ item.1 }}/{{ item.0.debsig_key_id }}"
    state: directory
    mode: "0755"
  loop: >-
    {{ apt_repos_debsig | product(['/etc/debsig/policies', '/usr/share/debsig/keyrings']) | list }}
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

- name: Create the debsig record directory
  ansible.builtin.file:
    path: /etc/workstation-debsig
    state: directory
    mode: "0755"
  when: apt_repos_debsig | length > 0

# Recorded so the image test asserts against the id actually used, rather than
# duplicating the constant into the test suite where the two could drift.
- name: Record the debsig key id used
  ansible.builtin.copy:
    content: "{{ item.debsig_key_id }}\n"
    dest: "/etc/workstation-debsig/{{ item.name }}"
    mode: "0644"
  loop: "{{ apt_repos_debsig }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install debsig policies
  ansible.builtin.get_url:
    url: "{{ item.debsig_policy_url }}"
    dest: "/etc/debsig/policies/{{ item.debsig_key_id }}/{{ item.name }}.pol"
    mode: "0644"
  loop: "{{ apt_repos_debsig }}"
  loop_control:
    label: "{{ item.name }}"

# The repository's own signing key, from the cache filled above.
- name: Install debsig keyrings
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/debsig/keyrings/{{ item.debsig_key_id }}/debsig.gpg
      /var/cache/workstation/keys/{{ item.name }}.asc
    creates: "/usr/share/debsig/keyrings/{{ item.debsig_key_id }}/debsig.gpg"
  loop: "{{ apt_repos_debsig }}"
  loop_control:
    label: "{{ item.name }}"

# latest, not present: base upgrades everything before these repositories
# are added, so a package already installed from elsewhere -- a .deb fetched
# by hand, or the GitHub runner's preinstalled docker-ce and Chrome -- would
# count as present at its old version and only catch up on the next converge.
# CI's idempotence pass reported exactly that as base's upgrade changing every
# run. Where the package is new or already current this is the same as present.
# package-latest guards against unpinned drift; base's dist-upgrade already
# takes every package to latest on every converge, so this adds none.
- name: Install packages from third-party repositories
  ansible.builtin.apt:
    name: "{{ apt_repos_enabled | map(attribute='packages') | flatten }}"
    state: latest  # noqa: package-latest
  when: apt_repos_enabled | length > 0

# Checked again now, not reused from the check above. On a first converge --
# every image build, and every CI runner -- that check ran before the vendor's
# package was installed, so it was false: our .list was written to bootstrap,
# then the postinst wrote .sources. Reusing that stale answer skipped the
# cleanup, shipped the dead .list in every image, and left it for the second
# converge to delete, which made CI's idempotence pass report a change on
# every run. If a future postinst ever stops writing .sources, this stays
# false and our .list is kept: apt still has a working source.
- name: Check again which vendors now manage their own apt source
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item.name }}.sources"
  loop: "{{ apt_repos_enabled | selectattr('vendor_sources', 'defined') | selectattr('vendor_sources') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: apt_repos_vendor_sources_installed

- name: Remove our bootstrap apt source where the vendor's has replaced it
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item.item.name }}.list"
    state: absent
  loop: "{{ apt_repos_vendor_sources_installed.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.name }}"

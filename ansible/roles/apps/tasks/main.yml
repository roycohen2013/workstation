---
# Snaps, flatpaks, and what individual apps need once they are installed.
# Their repositories and packages come from roles/apt_repos and
# roles/pinned_downloads, which both run before this role. Everything is driven
# by the data in group_vars/all.yml -- adding software should never mean
# editing this file.

# Claude Desktop's Cowork tab runs agentic work in a QEMU/KVM virtual machine.
# It needs /dev/kvm and /dev/vhost-vsock, and only kvm group members can open
# the latter -- so joining the group is required even where /dev/kvm alone is
# already accessible.
#
# This lives here, not in workstation_user_groups, because roles/base creates
# the user long before these packages exist: the kvm group is created by the
# qemu recommends pulled in just above, so joining it any earlier fails.
- name: Add the workstation user to the kvm group for Cowork
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: kvm
    append: true
  when: workstation_claude_desktop_enabled | bool

# --- BalenaEtcher ---------------------------------------------------------
# Downloaded and installed by roles/pinned_downloads, which runs before this
# role; what follows only makes it launch.
#
# BalenaEtcher's Chromium sandbox routinely fails to initialise for reasons
# that have nothing to do with security here -- a setuid helper with the
# wrong permissions, a restrictive kernel, running inside a VM -- and when it
# does, the app refuses to launch at all rather than degrading. --no-sandbox
# is upstream's own documented workaround. It is forced unconditionally,
# rather than left to whoever launches it to remember, because the failure
# mode without it is Etcher not starting at the exact moment you are trying
# to flash a drive.
#
# The binary to wrap is discovered from the package's own .desktop file by
# files/launcher-binary.sh, rather than from a hard-coded path: electron-
# builder's install layout has varied across releases, and a guessed path that
# turns out wrong would silently skip the wrapper instead of failing loudly.
# Installed rather than run from here because the image test checks the
# wrapper with the same script, so the two agree on which file is the binary.
# Created here, not assumed: only roles/firstboot makes this directory, and it
# runs in the image phase alone, so on a machine converged by `make apply` it
# does not exist.
- name: Create the directory for the launcher-binary helper
  ansible.builtin.file:
    path: /usr/local/lib/workstation
    state: directory
    mode: "0755"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Install the launcher-binary helper
  ansible.builtin.copy:
    src: launcher-binary.sh
    dest: /usr/local/lib/workstation/launcher-binary
    mode: "0755"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Resolve the real binary BalenaEtcher's launcher runs
  ansible.builtin.command:
    cmd: /usr/local/lib/workstation/launcher-binary balena-etcher
  register: apps_etcher_real_binary
  changed_when: false
  failed_when: false
  # Read-only, so it runs under `make apply-check` too. Skipped there, as
  # command tasks are by default, it left no stdout, and the assert below
  # failed on every machine.
  check_mode: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

# In check mode a failure here can be check mode's own doing: a balena-etcher
# or helper that this preview only reported installing is not on disk to
# resolve. Say so and skip the wrapper; `make apply` installs them for real,
# and fails loudly here if resolving still does not work.
- name: Note that BalenaEtcher's wrapper cannot be previewed yet
  ansible.builtin.debug:
    msg: >-
      Cannot resolve BalenaEtcher's real binary in check mode
      ({{ apps_etcher_real_binary.stderr | default('', true)
         or apps_etcher_real_binary.msg | default('no output', true) }}), so the
      --no-sandbox wrapper is not previewed. `make apply` installs what it
      needs first.
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - ansible_check_mode
    - apps_etcher_real_binary.rc != 0

- name: Fail loudly if the real binary could not be resolved
  ansible.builtin.assert:
    that: apps_etcher_real_binary.rc == 0 and apps_etcher_real_binary.stdout | length > 0
    fail_msg: >-
      Could not resolve BalenaEtcher's real binary from its .desktop file
      ({{ apps_etcher_real_binary.stderr | default('', true)
         or apps_etcher_real_binary.msg | default('no output', true) }}). Without
      it the --no-sandbox wrapper cannot be installed, and the package would
      ship in a state this repo has decided is not acceptable to ship silently.
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - not (ansible_check_mode and apps_etcher_real_binary.rc != 0)

# Keyed on what is at <binary> now, not on whether <binary>.real exists.
# dpkg does not track .real, so a version bump writes the NEW binary over our
# wrapper and leaves the OLD one sitting at .real; a `creates:` guard on .real
# would then skip the move, the wrapper would be rewritten over the new binary,
# and the old release's binary would run against the new release's resources.
# So: if <binary> is anything other than our wrapper -- a fresh install or an
# upgrade alike -- it is the real binary and goes to .real, replacing whatever
# was there. The marker is the wrapper's "Managed by Ansible" line, which
# wrappers written before this check already carry.
- name: Move the real binary aside
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      bin="{{ apps_etcher_real_binary.stdout }}"
      if grep -qF 'Managed by Ansible (roles/apps)' <(head -c 512 "$bin"); then
        if [ -e "$bin.real" ]; then
          echo unchanged
          exit 0
        fi
        echo "$bin is the wrapper but $bin.real is missing; reinstall balena-etcher" >&2
        exit 1
      fi
      mv -f "$bin" "$bin.real"
      echo moved
    executable: /bin/bash
  register: apps_etcher_move_aside
  changed_when: apps_etcher_move_aside.stdout == 'moved'
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Install the --no-sandbox wrapper in its place
  ansible.builtin.copy:
    dest: "{{ apps_etcher_real_binary.stdout }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why this exists.
      exec "{{ apps_etcher_real_binary.stdout }}.real" --no-sandbox "$@"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - not (ansible_check_mode and apps_etcher_real_binary.rc != 0)

# --- Snaps --------------------------------------------------------------------
- name: Install snaps
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ apps_snap }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_snap | length > 0

# --- Nimbalyst ----------------------------------------------------------------
# The AppImage itself is installed by roles/pinned_downloads, which runs before
# this role; what follows integrates it with the desktop.
- name: Install the AppImage runtime dependency
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
  when: workstation_nimbalyst_enabled | bool

# The AppImage carries its own icon, so it is taken from there rather than
# committed as a binary blob. Extracting a single path costs 36KB, not the
# ~1GB a full --appimage-extract would; guarded on the INSTALLED icon rather
# than on the extraction directory, so cleaning up the temporary tree does not
# make this re-run forever.
- name: Extract and install the Nimbalyst icon
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"
      /opt/nimbalyst/Nimbalyst.AppImage --appimage-extract \
        usr/share/icons/hicolor/512x512/apps/nimbalyst.png >/dev/null
      install -D -m 0644 \
        squashfs-root/usr/share/icons/hicolor/512x512/apps/nimbalyst.png \
        /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
    creates: /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
  when: workstation_nimbalyst_enabled | bool

# Mirrors the entry inside the AppImage, with an absolute Exec. --no-sandbox is
# not this repo being cautious: it is what the vendor's own desktop entry ships,
# and Ubuntu sets kernel.apparmor_restrict_unprivileged_userns=1, which stops an
# unpackaged Electron app from creating its sandbox at all.
- name: Install the Nimbalyst desktop entry
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=Nimbalyst
      Comment=Visual workspace for coding agents
      Exec=/opt/nimbalyst/Nimbalyst.AppImage --no-sandbox %U
      Icon=nimbalyst
      Terminal=false
      Type=Application
      StartupWMClass=Nimbalyst
      MimeType=text/markdown;x-scheme-handler/nimbalyst;
      Categories=Utility;Development;
    dest: /usr/share/applications/nimbalyst.desktop
    mode: "0644"
  when: workstation_nimbalyst_enabled | bool

- name: Link Nimbalyst onto PATH
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why --no-sandbox is here.
      exec /opt/nimbalyst/Nimbalyst.AppImage --no-sandbox "$@"
    dest: /usr/local/bin/nimbalyst
    mode: "0755"
  when: workstation_nimbalyst_enabled | bool

# --- Flatpaks -----------------------------------------------------------------
- name: Install flatpaks
  community.general.flatpak:
    name: "{{ item }}"
    remote: flathub
    method: system
    state: present
  loop: "{{ apps_flatpak }}"
  when:
    - workstation_flatpak_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_flatpak | length > 0

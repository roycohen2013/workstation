---
# Snaps, flatpaks, and what individual apps need once they are installed.
# Their repositories and packages come from roles/apt_repos and
# roles/pinned_downloads, which both run before this role. Everything is driven
# by the data in group_vars/all.yml -- adding software should never mean
# editing this file.

# Claude Desktop's Cowork tab runs agentic work in a QEMU/KVM virtual machine.
# It needs /dev/kvm and /dev/vhost-vsock, and only kvm group members can open
# the latter -- so joining the group is required even where /dev/kvm alone is
# already accessible.
#
# This lives here, not in workstation_user_groups, because roles/base creates
# the user long before these packages exist: the kvm group is created by the
# qemu recommends pulled in just above, so joining it any earlier fails.
- name: Add the workstation user to the kvm group for Cowork
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: kvm
    append: true
  when: workstation_claude_desktop_enabled | bool

# --- BalenaEtcher ---------------------------------------------------------
# Downloaded and installed by roles/pinned_downloads, which runs before this
# role; what follows only makes it launch.
#
# BalenaEtcher's Chromium sandbox routinely fails to initialise for reasons
# that have nothing to do with security here -- a setuid helper with the
# wrong permissions, a restrictive kernel, running inside a VM -- and when it
# does, the app refuses to launch at all rather than degrading. --no-sandbox
# is upstream's own documented workaround. It is forced unconditionally,
# rather than left to whoever launches it to remember, because the failure
# mode without it is Etcher not starting at the exact moment you are trying
# to flash a drive.
#
# The binary to wrap is discovered from the package's own .desktop file
# rather than a hardcoded path: electron-builder's install layout has varied
# across releases, and a guessed path that turns out wrong would silently
# skip the wrapper instead of failing loudly.
- name: Find BalenaEtcher's desktop launcher
  ansible.builtin.shell:
    cmd: set -o pipefail && dpkg -L balena-etcher | grep -E '\.desktop$' | head -1
    executable: /bin/bash
  register: apps_etcher_desktop_file
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Read its Exec line
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      grep -m1 '^Exec=' "{{ apps_etcher_desktop_file.stdout }}" | sed 's/^Exec=//'
    executable: /bin/bash
  register: apps_etcher_exec_line
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_etcher_desktop_file.stdout | default('') | length > 0

- name: Resolve the real binary the launcher points at
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cmd=$(echo "{{ apps_etcher_exec_line.stdout | default('') }}" | awk '{print $1}')
      case "$cmd" in
        /*) bin="$cmd" ;;
        *)  bin=$(command -v "$cmd" || true) ;;
      esac
      [ -n "$bin" ] && readlink -f "$bin"
    executable: /bin/bash
  register: apps_etcher_real_binary
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_etcher_exec_line.stdout | default('') | length > 0

- name: Fail loudly if the real binary could not be resolved
  ansible.builtin.assert:
    that: apps_etcher_real_binary.stdout | default('') | length > 0
    fail_msg: >-
      Could not resolve BalenaEtcher's real binary from its .desktop file
      (Exec={{ apps_etcher_exec_line.stdout | default('unknown') }}). Without it the
      --no-sandbox wrapper cannot be installed, and the package would ship in
      a state this repo has decided is not acceptable to ship silently.
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Move the real binary aside
  ansible.builtin.command:
    cmd: mv "{{ apps_etcher_real_binary.stdout }}" "{{ apps_etcher_real_binary.stdout }}.real"
    creates: "{{ apps_etcher_real_binary.stdout }}.real"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Install the --no-sandbox wrapper in its place
  ansible.builtin.copy:
    dest: "{{ apps_etcher_real_binary.stdout }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why this exists.
      exec "{{ apps_etcher_real_binary.stdout }}.real" --no-sandbox "$@"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

# --- Snaps --------------------------------------------------------------------
- name: Install snaps
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ apps_snap }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_snap | length > 0

# --- Nimbalyst ----------------------------------------------------------------
# The AppImage itself is installed by roles/pinned_downloads, which runs before
# this role; what follows integrates it with the desktop.
- name: Install the AppImage runtime dependency
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
  when: workstation_nimbalyst_enabled | bool

# The AppImage carries its own icon, so it is taken from there rather than
# committed as a binary blob. Extracting a single path costs 36KB, not the
# ~1GB a full --appimage-extract would; guarded on the INSTALLED icon rather
# than on the extraction directory, so cleaning up the temporary tree does not
# make this re-run forever.
- name: Extract and install the Nimbalyst icon
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"
      /opt/nimbalyst/Nimbalyst.AppImage --appimage-extract \
        usr/share/icons/hicolor/512x512/apps/nimbalyst.png >/dev/null
      install -D -m 0644 \
        squashfs-root/usr/share/icons/hicolor/512x512/apps/nimbalyst.png \
        /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
    creates: /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
  when: workstation_nimbalyst_enabled | bool

# Mirrors the entry inside the AppImage, with an absolute Exec. --no-sandbox is
# not this repo being cautious: it is what the vendor's own desktop entry ships,
# and Ubuntu sets kernel.apparmor_restrict_unprivileged_userns=1, which stops an
# unpackaged Electron app from creating its sandbox at all.
- name: Install the Nimbalyst desktop entry
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=Nimbalyst
      Comment=Visual workspace for coding agents
      Exec=/opt/nimbalyst/Nimbalyst.AppImage --no-sandbox %U
      Icon=nimbalyst
      Terminal=false
      Type=Application
      StartupWMClass=Nimbalyst
      MimeType=text/markdown;x-scheme-handler/nimbalyst;
      Categories=Utility;Development;
    dest: /usr/share/applications/nimbalyst.desktop
    mode: "0644"
  when: workstation_nimbalyst_enabled | bool

- name: Link Nimbalyst onto PATH
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why --no-sandbox is here.
      exec /opt/nimbalyst/Nimbalyst.AppImage --no-sandbox "$@"
    dest: /usr/local/bin/nimbalyst
    mode: "0755"
  when: workstation_nimbalyst_enabled | bool

# --- Flatpaks -----------------------------------------------------------------
- name: Install flatpaks
  community.general.flatpak:
    name: "{{ item }}"
    remote: flathub
    method: system
    state: present
  loop: "{{ apps_flatpak }}"
  when:
    - workstation_flatpak_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_flatpak | length > 0

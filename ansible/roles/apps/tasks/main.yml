---
# Third-party APT repositories, snaps and flatpaks. Everything is driven by the
# data in group_vars/all.yml -- adding software should never mean editing this
# file.

# --- Third-party APT repositories ---------------------------------------------
- name: Ensure keyring directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /usr/share/keyrings

# `enabled` is usually a template referencing a feature switch, which renders
# to a string. selectattr() would truth-test that string, and a non-empty
# "False" is truthy -- silently enabling a repository that is switched off.
# An explicit `| bool` is the only reliable test here.
- name: Select enabled repositories
  ansible.builtin.set_fact:
    apps_repos_enabled: "{{ apps_repos_enabled + [item] }}"
  loop: "{{ apps_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(true) | bool

# Keys are dearmoured into /etc/apt/keyrings and referenced per-repo with
# signed-by, rather than added to the deprecated global trusted keyring where
# any one vendor key would be trusted to sign any package.
# Kept, not deleted afterwards, and out of /tmp. get_url compares an existing
# file against what it fetches and reports ok when they match -- but only if
# the file is still there. Deleting it made this task, and the dearmour and
# apt_repository tasks below it, report changed on every single converge; the
# CI idempotence pass is what surfaced that. /var/cache rather than /tmp so it
# also survives a reboot. This is public key material, a few KB per vendor.
- name: Ensure the key cache exists
  ansible.builtin.file:
    path: /var/cache/workstation/keys
    state: directory
    mode: "0755"

- name: Fetch repository signing keys
  ansible.builtin.get_url:
    url: "{{ item.key_url }}"
    dest: "/var/cache/workstation/keys/{{ item.name }}.asc"
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# Key handling is two independent choices, because vendors differ on both:
#   key_path     where the keyring lands (default: /etc/apt/keyrings/<name>.gpg)
#   key_armoured whether to copy the .asc verbatim or dearmour it first
#
# It matters because several vendors' packages register their own
# sources.list.d entry naming a keyring path of their choosing -- if that file
# does not exist, every later apt update fails with NO_PUBKEY. Matching the
# vendor's documented layout keeps apt working whichever entry wins.
#   docker:           defaults (dearmoured, our path)
#   claude-desktop:   armoured, vendor path
#   1password:        dearmoured, vendor path
#   hashicorp:        dearmoured, vendor path -- see the note in group_vars
- name: Install repository signing keys (dearmoured)
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o {{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}
      /var/cache/workstation/keys/{{ item.name }}.asc
    creates: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.key_armoured | default(false) | bool)

- name: Install repository signing keys (armoured, verbatim)
  ansible.builtin.copy:
    src: "/var/cache/workstation/keys/{{ item.name }}.asc"
    dest: "{{ item.key_path }}"
    remote_src: true
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key_armoured | default(false) | bool

- name: Set keyring permissions
  ansible.builtin.file:
    path: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
    # Refresh inline rather than in a separate changed-gated task: the very
    # next task installs from these repositories, and a handler would not run
    # until the end of the play -- far too late.
    update_cache: true
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# 1Password's debsig-verify policy. This verifies the .deb's own signature, in
# addition to apt verifying the repository -- so it has to be in place before
# the package installs, not after.
#
# If apps_1password_debsig_key_id is wrong, these files land in a directory
# dpkg never consults and the policy is silently inert. apt install still
# succeeds, which is why goss asserts the paths rather than trusting them.
- name: Create 1Password debsig directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "/etc/debsig/policies/{{ apps_1password_debsig_key_id }}"
    - "/usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}"
  when: workstation_1password_enabled | bool

# Recorded so the image test asserts against the id actually used, rather than
# duplicating the constant into the test suite where the two could drift.
- name: Record the debsig key id used
  ansible.builtin.copy:
    content: "{{ apps_1password_debsig_key_id }}\n"
    dest: /etc/workstation-debsig-id
    mode: "0644"
  when: workstation_1password_enabled | bool

- name: Install 1Password debsig policy
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: "/etc/debsig/policies/{{ apps_1password_debsig_key_id }}/1password.pol"
    mode: "0644"
  when: workstation_1password_enabled | bool

- name: Install 1Password debsig keyring
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}/debsig.gpg
      /var/cache/workstation/keys/1password.asc
    creates: "/usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}/debsig.gpg"
  when: workstation_1password_enabled | bool

# Chrome re-adds its own apt source and keyring -- from postinst and from a
# daily cron job -- writing the same sources.list.d filename this role manages.
# If its version wins and names a keyring we never created, every later apt
# update fails with NO_PUBKEY. Chrome reads this file to decide whether to do
# that, so it has to exist BEFORE the package installs.
- name: Stop Google Chrome managing its own apt source
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/apps) -- this repo owns the apt entry.
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    dest: /etc/default/google-chrome
    mode: "0644"
  when: workstation_chrome_enabled | bool

- name: Install packages from third-party repositories
  ansible.builtin.apt:
    name: "{{ apps_repos_enabled | map(attribute='packages') | flatten }}"
    state: present
  when: apps_repos_enabled | length > 0

# Claude Desktop's Cowork tab runs agentic work in a QEMU/KVM virtual machine.
# It needs /dev/kvm and /dev/vhost-vsock, and only kvm group members can open
# the latter -- so joining the group is required even where /dev/kvm alone is
# already accessible.
#
# This lives here, not in workstation_user_groups, because roles/base creates
# the user long before these packages exist: the kvm group is created by the
# qemu recommends pulled in just above, so joining it any earlier fails.
- name: Add the workstation user to the kvm group for Cowork
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: kvm
    append: true
  when: workstation_claude_desktop_enabled | bool

# --- BalenaEtcher ---------------------------------------------------------
# No apt repository exists in current vendor docs -- only a versioned .deb
# from GitHub releases, installed the way the vendor itself documents:
# `apt install ./balena-etcher_*_amd64.deb`. ansible.builtin.apt's deb: param
# is exactly that -- apt, not raw dpkg, so dependencies resolve against the
# configured archive automatically.
# Gated on what is already installed. The .deb is ~150MB and is deleted after
# installing, so without this it was re-downloaded on every converge and this
# task, the install and the cleanup all reported changed forever -- which is
# what the CI idempotence pass reports. Deleting it is still right: keeping
# 150MB of installer in the image to gain idempotence would be a bad trade,
# so the version check provides it instead.
- name: Check the installed BalenaEtcher version
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}' balena-etcher
  register: apps_etcher_installed
  changed_when: false
  failed_when: false
  when: workstation_balena_etcher_enabled | bool

- name: Download BalenaEtcher
  ansible.builtin.get_url:
    url: "{{ balena_etcher_deb_url }}"
    dest: "/tmp/balena-etcher_{{ balena_etcher_version }}_amd64.deb"
    checksum: "sha256:{{ balena_etcher_deb_sha256 }}"
    mode: "0644"
  when:
    - workstation_balena_etcher_enabled | bool
    - apps_etcher_installed.stdout | default('') != balena_etcher_version
    - workstation_desktop_enabled | bool

- name: Install BalenaEtcher
  ansible.builtin.apt:
    deb: "/tmp/balena-etcher_{{ balena_etcher_version }}_amd64.deb"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_etcher_installed.stdout | default('') != balena_etcher_version

# BalenaEtcher's Chromium sandbox routinely fails to initialise for reasons
# that have nothing to do with security here -- a setuid helper with the
# wrong permissions, a restrictive kernel, running inside a VM -- and when it
# does, the app refuses to launch at all rather than degrading. --no-sandbox
# is upstream's own documented workaround. It is forced unconditionally,
# rather than left to whoever launches it to remember, because the failure
# mode without it is Etcher not starting at the exact moment you are trying
# to flash a drive.
#
# The binary to wrap is discovered from the package's own .desktop file
# rather than a hardcoded path: electron-builder's install layout has varied
# across releases, and a guessed path that turns out wrong would silently
# skip the wrapper instead of failing loudly.
- name: Find BalenaEtcher's desktop launcher
  ansible.builtin.shell:
    cmd: set -o pipefail && dpkg -L balena-etcher | grep -E '\.desktop$' | head -1
    executable: /bin/bash
  register: apps_etcher_desktop_file
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Read its Exec line
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      grep -m1 '^Exec=' "{{ apps_etcher_desktop_file.stdout }}" | sed 's/^Exec=//'
    executable: /bin/bash
  register: apps_etcher_exec_line
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_etcher_desktop_file.stdout | default('') | length > 0

- name: Resolve the real binary the launcher points at
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cmd=$(echo "{{ apps_etcher_exec_line.stdout | default('') }}" | awk '{print $1}')
      case "$cmd" in
        /*) bin="$cmd" ;;
        *)  bin=$(command -v "$cmd" || true) ;;
      esac
      [ -n "$bin" ] && readlink -f "$bin"
    executable: /bin/bash
  register: apps_etcher_real_binary
  changed_when: false
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_etcher_exec_line.stdout | default('') | length > 0

- name: Fail loudly if the real binary could not be resolved
  ansible.builtin.assert:
    that: apps_etcher_real_binary.stdout | default('') | length > 0
    fail_msg: >-
      Could not resolve BalenaEtcher's real binary from its .desktop file
      (Exec={{ apps_etcher_exec_line.stdout | default('unknown') }}). Without it the
      --no-sandbox wrapper cannot be installed, and the package would ship in
      a state this repo has decided is not acceptable to ship silently.
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Move the real binary aside
  ansible.builtin.command:
    cmd: mv "{{ apps_etcher_real_binary.stdout }}" "{{ apps_etcher_real_binary.stdout }}.real"
    creates: "{{ apps_etcher_real_binary.stdout }}.real"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Install the --no-sandbox wrapper in its place
  ansible.builtin.copy:
    dest: "{{ apps_etcher_real_binary.stdout }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why this exists.
      exec "{{ apps_etcher_real_binary.stdout }}.real" --no-sandbox "$@"
  when:
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

- name: Remove the downloaded BalenaEtcher package
  ansible.builtin.file:
    path: "/tmp/balena-etcher_{{ balena_etcher_version }}_amd64.deb"
    state: absent
  when:
    - apps_etcher_installed.stdout | default('') != balena_etcher_version
    - workstation_balena_etcher_enabled | bool
    - workstation_desktop_enabled | bool

# --- Snaps --------------------------------------------------------------------
- name: Install snaps
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ apps_snap }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_snap | length > 0

# --- Flatpaks -----------------------------------------------------------------
# --- Nimbalyst ----------------------------------------------------------------
# Distributed as an AppImage and nothing else on Linux. Unlike BalenaEtcher
# below, the file is kept in place rather than downloaded and deleted: get_url
# with a checksum re-verifies an existing file and reports ok, so a converge
# does not re-fetch 470MB. The download/delete pairs elsewhere in this role are
# why the CI idempotence pass reports changes on every run.
- name: Install the AppImage runtime dependency
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
  when: workstation_nimbalyst_enabled | bool

- name: Create the Nimbalyst directory
  ansible.builtin.file:
    path: /opt/nimbalyst
    state: directory
    mode: "0755"
  when: workstation_nimbalyst_enabled | bool

- name: Install Nimbalyst
  ansible.builtin.get_url:
    url: "{{ nimbalyst_appimage_url }}"
    dest: /opt/nimbalyst/Nimbalyst.AppImage
    checksum: "sha512:{{ nimbalyst_appimage_sha512 }}"
    mode: "0755"
  when: workstation_nimbalyst_enabled | bool

# The AppImage carries its own icon, so it is taken from there rather than
# committed as a binary blob. Extracting a single path costs 36KB, not the
# ~1GB a full --appimage-extract would; guarded on the INSTALLED icon rather
# than on the extraction directory, so cleaning up the temporary tree does not
# make this re-run forever.
- name: Extract and install the Nimbalyst icon
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"
      /opt/nimbalyst/Nimbalyst.AppImage --appimage-extract \
        usr/share/icons/hicolor/512x512/apps/nimbalyst.png >/dev/null
      install -D -m 0644 \
        squashfs-root/usr/share/icons/hicolor/512x512/apps/nimbalyst.png \
        /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
    creates: /usr/share/icons/hicolor/512x512/apps/nimbalyst.png
  when: workstation_nimbalyst_enabled | bool

# Mirrors the entry inside the AppImage, with an absolute Exec. --no-sandbox is
# not this repo being cautious: it is what the vendor's own desktop entry ships,
# and Ubuntu sets kernel.apparmor_restrict_unprivileged_userns=1, which stops an
# unpackaged Electron app from creating its sandbox at all.
- name: Install the Nimbalyst desktop entry
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=Nimbalyst
      Comment=Visual workspace for coding agents
      Exec=/opt/nimbalyst/Nimbalyst.AppImage --no-sandbox %U
      Icon=nimbalyst
      Terminal=false
      Type=Application
      StartupWMClass=Nimbalyst
      MimeType=text/markdown;x-scheme-handler/nimbalyst;
      Categories=Utility;Development;
    dest: /usr/share/applications/nimbalyst.desktop
    mode: "0644"
  when: workstation_nimbalyst_enabled | bool

- name: Link Nimbalyst onto PATH
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/apps). See the comment above this block in
      # ansible/roles/apps/tasks/main.yml for why --no-sandbox is here.
      exec /opt/nimbalyst/Nimbalyst.AppImage --no-sandbox "$@"
    dest: /usr/local/bin/nimbalyst
    mode: "0755"
  when: workstation_nimbalyst_enabled | bool

- name: Install flatpaks
  community.general.flatpak:
    name: "{{ item }}"
    remote: flathub
    method: system
    state: present
  loop: "{{ apps_flatpak }}"
  when:
    - workstation_flatpak_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_flatpak | length > 0

---
# Third-party APT repositories, snaps and flatpaks. Everything is driven by the
# data in group_vars/all.yml -- adding software should never mean editing this
# file.

# --- Third-party APT repositories ---------------------------------------------
- name: Ensure keyring directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /usr/share/keyrings

# `enabled` is usually a template referencing a feature switch, which renders
# to a string. selectattr() would truth-test that string, and a non-empty
# "False" is truthy -- silently enabling a repository that is switched off.
# An explicit `| bool` is the only reliable test here.
- name: Select enabled repositories
  ansible.builtin.set_fact:
    apps_repos_enabled: "{{ apps_repos_enabled + [item] }}"
  loop: "{{ apps_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(true) | bool

# Keys are dearmoured into /etc/apt/keyrings and referenced per-repo with
# signed-by, rather than added to the deprecated global trusted keyring where
# any one vendor key would be trusted to sign any package.
- name: Fetch repository signing keys
  ansible.builtin.get_url:
    url: "{{ item.key_url }}"
    dest: "/tmp/{{ item.name }}.asc"
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# Key handling is two independent choices, because vendors differ on both:
#   key_path     where the keyring lands (default: /etc/apt/keyrings/<name>.gpg)
#   key_armoured whether to copy the .asc verbatim or dearmour it first
#
# It matters because several vendors' packages register their own
# sources.list.d entry naming a keyring path of their choosing -- if that file
# does not exist, every later apt update fails with NO_PUBKEY. Matching the
# vendor's documented layout keeps apt working whichever entry wins.
#   docker/hashicorp: defaults (dearmoured, our path)
#   claude-desktop:   armoured, vendor path
#   1password:        dearmoured, vendor path
- name: Install repository signing keys (dearmoured)
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o {{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}
      /tmp/{{ item.name }}.asc
    creates: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.key_armoured | default(false) | bool)

- name: Install repository signing keys (armoured, verbatim)
  ansible.builtin.copy:
    src: "/tmp/{{ item.name }}.asc"
    dest: "{{ item.key_path }}"
    remote_src: true
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key_armoured | default(false) | bool

- name: Set keyring permissions
  ansible.builtin.file:
    path: "{{ item.key_path | default('/etc/apt/keyrings/' ~ item.name ~ '.gpg') }}"
    mode: "0644"
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
    # Refresh inline rather than in a separate changed-gated task: the very
    # next task installs from these repositories, and a handler would not run
    # until the end of the play -- far too late.
    update_cache: true
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# 1Password's debsig-verify policy. This verifies the .deb's own signature, in
# addition to apt verifying the repository -- so it has to be in place before
# the package installs, not after.
#
# If apps_1password_debsig_key_id is wrong, these files land in a directory
# dpkg never consults and the policy is silently inert. apt install still
# succeeds, which is why goss asserts the paths rather than trusting them.
- name: Create 1Password debsig directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "/etc/debsig/policies/{{ apps_1password_debsig_key_id }}"
    - "/usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}"
  when: workstation_1password_enabled | bool

# Recorded so the image test asserts against the id actually used, rather than
# duplicating the constant into the test suite where the two could drift.
- name: Record the debsig key id used
  ansible.builtin.copy:
    content: "{{ apps_1password_debsig_key_id }}\n"
    dest: /etc/workstation-debsig-id
    mode: "0644"
  when: workstation_1password_enabled | bool

- name: Install 1Password debsig policy
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: "/etc/debsig/policies/{{ apps_1password_debsig_key_id }}/1password.pol"
    mode: "0644"
  when: workstation_1password_enabled | bool

- name: Install 1Password debsig keyring
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}/debsig.gpg
      /tmp/1password.asc
    creates: "/usr/share/debsig/keyrings/{{ apps_1password_debsig_key_id }}/debsig.gpg"
  when: workstation_1password_enabled | bool

# Chrome re-adds its own apt source and keyring -- from postinst and from a
# daily cron job -- writing the same sources.list.d filename this role manages.
# If its version wins and names a keyring we never created, every later apt
# update fails with NO_PUBKEY. Chrome reads this file to decide whether to do
# that, so it has to exist BEFORE the package installs.
- name: Stop Google Chrome managing its own apt source
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/apps) -- this repo owns the apt entry.
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    dest: /etc/default/google-chrome
    mode: "0644"
  when: workstation_chrome_enabled | bool

- name: Install packages from third-party repositories
  ansible.builtin.apt:
    name: "{{ apps_repos_enabled | map(attribute='packages') | flatten }}"
    state: present
  when: apps_repos_enabled | length > 0

- name: Remove downloaded key material
  ansible.builtin.file:
    path: "/tmp/{{ item.name }}.asc"
    state: absent
  loop: "{{ apps_repos_enabled }}"
  loop_control:
    label: "{{ item.name }}"

# Claude Desktop's Cowork tab runs agentic work in a QEMU/KVM virtual machine.
# It needs /dev/kvm and /dev/vhost-vsock, and only kvm group members can open
# the latter -- so joining the group is required even where /dev/kvm alone is
# already accessible.
#
# This lives here, not in workstation_user_groups, because roles/base creates
# the user long before these packages exist: the kvm group is created by the
# qemu recommends pulled in just above, so joining it any earlier fails.
- name: Add the workstation user to the kvm group for Cowork
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: kvm
    append: true
  when: workstation_claude_desktop_enabled | bool

# --- Snaps --------------------------------------------------------------------
- name: Install snaps
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ apps_snap }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_snap | length > 0

# --- Flatpaks -----------------------------------------------------------------
- name: Install flatpaks
  community.general.flatpak:
    name: "{{ item }}"
    remote: flathub
    method: system
    state: present
  loop: "{{ apps_flatpak }}"
  when:
    - workstation_flatpak_enabled | bool
    - workstation_desktop_enabled | bool
    - apps_flatpak | length > 0

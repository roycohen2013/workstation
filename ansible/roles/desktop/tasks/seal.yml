---
# roles/desktop's image-phase half. roles/seal runs this once every role has
# converged; it never runs on a live machine, and runs whether or not the
# desktop was enabled, so it only ever removes.

# The desktop info stamp names one machine's hostname and IP. Only a logged-in
# graphical session writes it, which a Packer build does not have, so it should
# never exist here -- removed anyway rather than resting on that reasoning: it
# lives under a home directory that IS in the image, and a wallpaper announcing
# the build VM's identity on every flashed laptop is exactly what sealing
# exists to prevent. The path is the renderer's cache directory in
# tasks/main.yml.
- name: Remove any desktop info stamp
  ansible.builtin.file:
    path: "/home/{{ workstation_user }}/.cache/workstation"
    state: absent

---
# Strips everything machine-specific and build-specific, turning a configured
# VM into a generic, redistributable template. Image phase only.
#
# What a role leaves behind that only it understands -- the SSH server's host
# keys, the desktop's stamp cache, power services left on -- that role cleans
# up itself, in an optional tasks/seal.yml found and run below. This role keeps
# only what belongs to no role: the build marker, package caches, machine
# identity, cloud-init, logs.
#
# What is NOT done here: removing the build account. Packer is still logged in
# as it and needs it to issue the shutdown. That final step runs from
# workstation-seal-final, detached, as the shutdown command -- see below.

- name: Confirm this is a build image
  ansible.builtin.stat:
    path: /etc/workstation-build-image
  register: seal_build_marker

- name: Refuse to seal anything that is not a build image
  ansible.builtin.assert:
    that: seal_build_marker.stat.exists
    fail_msg: >-
      /etc/workstation-build-image is missing. The seal role destroys machine
      identity and must never run against a real workstation.

- name: Record image metadata
  ansible.builtin.copy:
    content: |
      WORKSTATION_VERSION={{ workstation_image_version }}
      WORKSTATION_BUILD_DATE={{ workstation_build_date }}
      WORKSTATION_UBUNTU={{ ansible_facts['distribution_version'] }}
      WORKSTATION_USER={{ workstation_user }}
    dest: /etc/workstation-release
    mode: "0644"

# --- Each role's own image-phase half -----------------------------------------
- name: Run each role's image-phase hook
  ansible.builtin.import_tasks: hooks.yml

# --- Package caches -----------------------------------------------------------
# autoremove only. The apt module runs one cleanup per task and then exits, so
# this used to say `autoclean: true` as well and never autoremoved anything:
# packages orphaned after base's upgrade shipped in every image. autoclean is
# not needed -- the task below deletes the downloaded .debs outright.
- name: Remove packages nothing depends on
  ansible.builtin.apt:
    autoremove: true

- name: Remove apt lists
  ansible.builtin.shell:
    cmd: rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
  changed_when: true

# --- Machine identity ---------------------------------------------------------
# Every machine written from this image must generate its own. Sharing a
# machine-id means colliding DHCP leases and indistinguishable journal
# identities across every laptop and VM built from the same artifact.
- name: Blank machine-id
  ansible.builtin.copy:
    content: ""
    dest: "{{ item }}"
    mode: "0644"
  loop:
    - /etc/machine-id
    - /var/lib/dbus/machine-id

# --- cloud-init ---------------------------------------------------------------
# cloud-init did its job during the install. Left enabled, it would try to
# reconfigure networking and users on the target machine at every boot.
- name: Clean cloud-init state
  ansible.builtin.command: cloud-init clean --logs --seed
  changed_when: true
  failed_when: false

- name: Disable cloud-init
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    mode: "0644"

# --- Logs and history ---------------------------------------------------------
- name: Rotate away the journal
  ansible.builtin.command: journalctl --rotate --vacuum-time=1s
  changed_when: true
  failed_when: false

- name: Truncate log files
  ansible.builtin.shell:
    cmd: find /var/log -type f -exec truncate -s 0 {} + 2>/dev/null || true
  changed_when: true

- name: Remove shell history
  ansible.builtin.shell:
    cmd: rm -f /root/.bash_history /home/*/.bash_history /home/*/.zsh_history
  changed_when: true

- name: Remove build marker
  ansible.builtin.file:
    path: /etc/workstation-build-image
    state: absent

# --- Free space ---------------------------------------------------------------
# fstrim punches holes in the qcow2 for deleted blocks (the builder sets
# discard=unmap), so the exported artifact reflects real usage rather than
# every byte ever written during the build.
- name: Discard unused blocks
  ansible.builtin.command: fstrim -av
  changed_when: true
  failed_when: false

# --- Final teardown, executed at shutdown ------------------------------------
- name: Install the final teardown script
  ansible.builtin.template:
    src: seal-final.sh.j2
    dest: /usr/local/sbin/workstation-seal-final
    mode: "0700"

---
- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
      - apt-listchanges
    state: present

# --- Firewall -----------------------------------------------------------------
- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ security_ufw_default_incoming }}"
  when: workstation_firewall_enabled | bool

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ security_ufw_default_outgoing }}"
  when: workstation_firewall_enabled | bool

- name: Open configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ security_ufw_allow }}"
  when: workstation_firewall_enabled | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: workstation_firewall_enabled | bool

# --- SSH server ---------------------------------------------------------------
# A laptop image usually wants sshd off. It is force-enabled during the build
# because that is Packer's only way in; the seal role turns it back off.
- name: Configure SSH server
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/security)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
    dest: /etc/ssh/sshd_config.d/10-workstation.conf
    mode: "0644"
    validate: "sshd -t -f %s"
  when: workstation_phase == 'live'
  notify: Restart sshd

- name: Set SSH server run state
  ansible.builtin.systemd:
    name: ssh
    enabled: "{{ workstation_ssh_server_enabled | bool }}"
    state: "{{ 'started' if workstation_ssh_server_enabled | bool else 'stopped' }}"
  when: workstation_phase == 'live'

# --- Automatic updates --------------------------------------------------------
- name: Configure unattended upgrades
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (roles/security)
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if security_unattended_reboot else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";
    dest: /etc/apt/apt.conf.d/52-workstation-unattended
    mode: "0644"
  when: security_unattended_upgrades | bool

- name: Enable periodic apt activity
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: security_unattended_upgrades | bool

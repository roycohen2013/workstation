[defaults]
inventory            = ansible/inventory/hosts.yml
roles_path           = ansible/roles
collections_path     = ansible/.collections
interpreter_python   = auto_silent
host_key_checking    = False
# community.general.yaml (the previous setting here) was removed in
# community.general 12.0.0. This is its documented replacement:
# callback_result_format on ansible-core's own builtin "default" callback,
# not a collection plugin, so it cannot be broken by a collection release
# again. Confirmed against `ansible-doc -t callback default` rather than
# assumed -- an earlier attempt at this fix guessed both the wrong ini
# section ([callback_default]) and the wrong key (result_format), which
# parsed without error but silently never took effect. Needs ansible-core
# >= 2.13; every version this repo has run under has been well past that.
stdout_callback      = default
callback_result_format = yaml
display_skipped_hosts = False
retry_files_enabled  = False
force_color          = True

[ssh_connection]
pipelining = True
